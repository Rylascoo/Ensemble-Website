<text x="80" y="68" class="title">KYMÆAN Lettering Master Study 02 — Mineral Humanist — Bespoke Control Redraw R2</text>
<text x="80" y="102" class="subtitle">Bespoke redraw · monochrome · exact fixed K · YMAEAN contains no source-font outlines</text>
<g fill="#17191B" transform="translate(81,180)"><use href="#word"/></g>
<line x1="80" y1="470" x2="1520" y2="470" stroke="#D4D0C8"/>
<text x="80" y="515" class="subtitle">Worked mass through taper, unequal width and soft tension. M/A/E/N carry the character; Y stays quiet and the repeated A is contextual. The M valley is resolved through white space rather than a visible hinge.</text>
<text x="80" y="650" class="proof-label">word-rhythm proofs — judge white space before novelty</text>
