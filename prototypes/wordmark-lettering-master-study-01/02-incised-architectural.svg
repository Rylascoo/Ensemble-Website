<text x="80" y="70" class="title">KYMÆAN Lettering Master Study 01 — Incised Architectural</text>
<text x="80" y="104" class="subtitle">Monochrome structural proof · exact fixed K · YMAEAN treated as one lettering object</text>
<g fill="#17191B"><use href="#K" transform="translate(59.71,154.21) scale(1.052632)"/><use href="#g-Y0" transform="translate(252.65,390.00)"/><use href="#g-M1" transform="translate(435.09,390.00)"/><use href="#g-A2" transform="translate(743.04,390.00)"/><use href="#g-E3" transform="translate(949.36,390.00)"/><use href="#g-A4" transform="translate(1105.31,390.00)"/><use href="#g-N5" transform="translate(1310.55,390.00)"/></g>
