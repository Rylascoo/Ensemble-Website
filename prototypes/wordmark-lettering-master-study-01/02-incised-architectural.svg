<text x="80" y="535" class="subtitle">Incision is expressed through controlled end flare, vertical poise and close spacing—not Roman serifs, wide luxury tracking or literal carving motifs.</text>
<text x="80" y="680" class="proof-label">detail controls — inspect mass, counter, terminal and diagonal behavior</text>
