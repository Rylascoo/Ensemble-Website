<text x="80" y="70" class="title">KYMÆAN Lettering Master Study 01 — Sculptural Grotesk</text>
<text x="80" y="104" class="subtitle">Monochrome structural proof · exact fixed K · YMAEAN treated as one lettering object</text>
<g fill="#17191B"><use href="#K" transform="translate(143.18,154.21) scale(1.052632)"/><use href="#g-Y0" transform="translate(334.13,390.00)"/><use href="#g-M1" transform="translate(478.48,390.00)"/><use href="#g-A2" transform="translate(768.95,390.00)"/><use href="#g-E3" transform="translate(941.54,390.00)"/><use href="#g-A4" transform="translate(1074.41,390.00)"/><use href="#g-N5" transform="translate(1245.65,390.00)"/></g>
