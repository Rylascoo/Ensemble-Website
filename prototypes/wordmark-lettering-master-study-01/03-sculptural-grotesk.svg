<text x="80" y="535" class="subtitle">Sans skeleton retained; physicality comes from nearly invisible bowing, unequal widths and pressure—not cuts, chamfers, modular radii or futuristic detailing.</text>
<text x="80" y="680" class="proof-label">detail controls — inspect mass, counter, terminal and diagonal behavior</text>
