@media(max-width:1400px) and (min-aspect-ratio:1.7/1){.a3{height:54svh;right:10vw}.p2{height:79svh;right:8.5vw}.trace{left:13.1vw;top:43vh;width:7.3vw;height:16.5vh}.adult{left:20.2vw;top:39vh;width:4.5vw;height:18vh}}

<script>
(()=>{
const order=['place','presence','empty1','person','empty2','trace','empty3','life'];
