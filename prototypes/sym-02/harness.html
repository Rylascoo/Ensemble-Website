<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SYM-02 Frozen Initial Batch Matrix</title>
<style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:#151515;background:#ededed}
*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1460px;margin:auto}
h1{margin:0 0 6px;font-size:24px}.note{margin:0 0 20px;max-width:980px;color:#444}
.family{background:#fff;border:1px solid #bbb;margin:0 0 18px;padding:14px}
.family>header{display:flex;align-items:baseline;gap:12px;border-bottom:1px solid #ddd;padding-bottom:8px}
.family h2,.family p{margin:0}.family code{margin-left:auto;font-size:11px}
.band{display:grid;grid-template-columns:repeat(8,minmax(92px,1fr));gap:8px;margin-top:10px;padding:8px;border:1px solid #ddd}
.probe{height:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px}
.probe-box{width:132px;max-width:100%;height:126px;display:grid;place-items:center}
.probe b{font-size:10px;font-weight:600}.dark{background:#111;color:#fff}
.mark{display:block;width:var(--s,40px);height:var(--s,40px);background:currentColor;-webkit-mask-image:var(--asset);mask-image:var(--asset);-webkit-mask-repeat:no-repeat;mask-repeat:no-repeat;-webkit-mask-position:center;mask-position:center;-webkit-mask-size:contain;mask-size:contain}
.roles{display:grid;grid-template-columns:150px minmax(220px,1fr) minmax(280px,1.25fr) minmax(240px,1fr);gap:10px;margin-top:10px}
.role{height:104px;border:1px solid #ccc;display:flex;align-items:center;gap:12px;padding:14px;position:relative}
.role-label{position:absolute;top:5px;left:7px;font-size:9px;letter-spacing:.08em;opacity:.65}
.icon{background:#111;color:#fff;justify-content:center;border-radius:22px}.role-icon{--s:64px}.role-chrome{--s:24px}.role-web{--s:36px}.role-prelude{--s:68px;margin:auto}
.proxy-lines{display:grid;gap:7px;flex:1}.proxy-lines i{height:7px;background:currentColor;opacity:.22;border-radius:4px}.proxy-lines i:last-child{width:58%}.proxy-lines.wide i:last-child{width:72%}.prelude{justify-content:center}
@media(max-width:700px){body{padding:10px}.band{grid-template-columns:repeat(2,minmax(0,1fr))}.band .probe:nth-child(7),.band .probe:nth-child(8){grid-column:1/-1}.roles{grid-template-columns:1fr}.family>header{flex-wrap:wrap}.family code{width:100%;margin:0}.role{min-width:0}}
@media(forced-colors:active){:root,body,.family,.band,.role,.dark,.icon,.prelude{background:Canvas;color:CanvasText;border-color:CanvasText}.mark{background:CanvasText;forced-color-adjust:none}.proxy-lines i{background:CanvasText;forced-color-adjust:none}}
</style>
</head>
<body><main>
<h1>SYM-02 — Frozen Initial Batch Matrix</h1>
<p class="note">Neutral monochrome review surface. C0-ORIGINAL is the exact immutable C0 asset. C0-R1/R2/R3 are bounded descendants; N1/N2/N3 are independent concepts. Geometry is invariant across size and role.</p>
<div id="families"></div><pre id="sym02-diagnostic" hidden></pre>
</main>
<script>
const sizes=[16,20,24,32,48,64,96,128];
const families=[
{id:'C0-ORIGINAL',name:'Threshold K',kind:'immutable control',src:'../../assets/brand/kymaean-threshold-k-working-candidate.svg'},
{id:'C0-R1',name:'Bézier Fidelity',kind:'refinement',src:'assets/c0-r1-bezier-fidelity.svg'},
{id:'C0-R2',name:'Curve/Tension Study',kind:'refinement',src:'assets/c0-r2-curve-tension.svg'},
{id:'C0-R3',name:'Proportion Study',kind:'refinement',src:'assets/c0-r3-proportion.svg'},
{id:'N1',name:'Counterform Junction',kind:'independent concept',src:'assets/n1-counterform-junction.svg'},
{id:'N2',name:'Tension Quartet',kind:'independent concept',src:'assets/n2-tension-quartet.svg'},
{id:'N3',name:'Emergent Spine',kind:'independent concept',src:'assets/n3-emergent-spine.svg'}
];
const mark=(src,size,cls='')=>`<span class="mark ${cls}" style="--asset:url('${src}');${size?`--s:${size}px;`:''}" aria-hidden="true"></span>`;
const probes=(src,dark)=>`<div class="band ${dark?'dark-band':''}">${sizes.map(s=>`<div class="probe ${dark?'dark':''}"><div class="probe-box">${mark(src,s,'probe-mark')}</div><b>${s}</b></div>`).join('')}</div>`;
const roles=src=>`<div class="roles"><div class="role icon"><span class="role-label">APP ICON</span>${mark(src,null,'role-icon')}</div><div class="role chrome"><span class="role-label">APP CHROME</span>${mark(src,null,'role-chrome')}<span class="proxy-lines"><i></i><i></i></span></div><div class="role web"><span class="role-label">WEB HEADER</span>${mark(src,null,'role-web')}<span class="proxy-lines wide"><i></i><i></i></span></div><div class="role prelude dark"><span class="role-label">WEB PRELUDE</span>${mark(src,null,'role-prelude')}</div></div>`;
document.getElementById('families').innerHTML=families.map(f=>`<section class="family" data-family="${f.id}" data-kind="${f.kind}" data-src="${f.src}"><header><h2>${f.id}</h2><p>${f.name}</p><code>${f.kind}</code></header>${probes(f.src,false)}${probes(f.src,true)}${roles(f.src)}</section>`).join('');
function unionBBox(svg){const els=[...svg.querySelectorAll('path,circle,ellipse,rect,polygon,polyline,line')].filter(e=>typeof e.getBBox==='function');let b=null;for(const e of els){let q;try{q=e.getBBox()}catch{continue}if(!q||(!q.width&&!q.height))continue;b=b?{x:Math.min(b.x,q.x),y:Math.min(b.y,q.y),r:Math.max(b.r,q.x+q.width),d:Math.max(b.d,q.y+q.height)}:{x:q.x,y:q.y,r:q.x+q.width,d:q.y+q.height}}return b?{x:b.x,y:b.y,width:b.r-b.x,height:b.d-b.y}:null}
(async()=>{const diag={viewport:{width:innerWidth,height:innerHeight,scrollWidth:document.documentElement.scrollWidth},forcedColors:matchMedia('(forced-colors: active)').matches,families:{}};
for(const f of families){const fam=document.querySelector(`[data-family="${f.id}"]`);const marks=[...fam.querySelectorAll('.mark')];const probeData=[...fam.querySelectorAll('.probe-mark')].map(m=>({w:m.getBoundingClientRect().width,h:m.getBoundingClientRect().height,mask:getComputedStyle(m).maskImage||getComputedStyle(m).webkitMaskImage,bg:getComputedStyle(m).backgroundColor}));let source=null,error=null;
try{const r=await fetch(f.src);if(!r.ok)throw new Error(`HTTP ${r.status}`);const text=await r.text();const doc=new DOMParser().parseFromString(text,'image/svg+xml');const svg=doc.documentElement;const vb=svg.viewBox.baseVal;const holder=document.createElement('div');holder.style='position:absolute;left:-10000px;top:-10000px;width:500px;height:500px';holder.appendChild(document.importNode(svg,true));document.body.appendChild(holder);const live=holder.querySelector('svg');live.setAttribute('width','500');live.setAttribute('height','500');const bbox=unionBBox(live);const pathBBoxes=[...live.querySelectorAll('path')].map(e=>{const q=e.getBBox();return {x:q.x,y:q.y,width:q.width,height:q.height}});source={viewBox:{x:vb.x,y:vb.y,width:vb.width,height:vb.height},bbox,pathBBoxes};holder.remove()}catch(e){error=String(e)}
diag.families[f.id]={kind:f.kind,src:f.src,probeCount:probeData.length,markCount:marks.length,probes:probeData,source,error}}
document.getElementById('sym02-diagnostic').textContent=JSON.stringify(diag);window.__SYM02_DIAGNOSTIC__=diag})();
</script>
</body>
</html>
