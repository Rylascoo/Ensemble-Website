<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SEL-S1 — Stage Character Focus / Selection Hinge</title>
<style>
:root{--page:#0f1114;--panel:#171a1f;--panel2:#13161a;--ink:#f2f2ee;--muted:#a6a6a0;--line:#5f6268;--beam:rgba(255,255,255,.14);--pool:rgba(255,255,255,.10)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",sans-serif}body{padding:20px}.intro{max-width:1100px;margin:0 auto 20px}.intro h1{font-size:20px;margin:0 0 6px}.intro p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.boards{display:grid;gap:18px;max-width:1120px;margin:0 auto}.board{border:1px solid #35383e;background:var(--panel);padding:14px}.board-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:10px}.board-title{font-weight:650;font-size:13px}.board-meta{font-size:11px;color:var(--muted);text-align:right}.stage{background:var(--panel2);border:1px solid #2a2d32;padding:16px 10px 10px;overflow:hidden}.cast{display:flex;align-items:flex-end;justify-content:center;gap:20px;min-height:286px;flex-wrap:nowrap}.char{position:relative;width:164px;height:250px;flex:0 0 164px;border:0;background:none;color:var(--ink);padding:0;outline:none;font:inherit}.beam{position:absolute;left:23%;top:8%;width:54%;height:58%;clip-path:polygon(42% 0,58% 0,92% 100%,8% 100%);background:var(--beam);border-top:1px solid #777b82}.pool{position:absolute;left:22%;top:58%;width:56%;height:15%;border-radius:50%;background:var(--pool);border:1px solid var(--line)}
.hinge{position:absolute;left:10%;top:55%;width:80%;height:39%;pointer-events:none}.namebox{position:absolute;left:0;right:0;bottom:5%;text-align:center;min-height:48px}.char-name{position:relative;display:inline-block;font-size:15px;font-weight:650;line-height:1.15}.state-label{display:block;margin-top:5px;font-size:9px;letter-spacing:.10em;color:var(--muted);white-space:nowrap}.family:not(.CINC) .char.focus-fixture .hinge::before,.family:not(.CINC) .char:focus-visible .hinge::before{content:"";position:absolute;inset:-2px;border:2px solid currentColor;border-radius:50%;pointer-events:none}.F1 .char.selected .char-name::after{content:"";position:absolute;left:15%;width:70%;bottom:-6px;height:2px;background:currentColor}.F2 .char.selected .hinge::after{content:"";position:absolute;left:50%;bottom:0;width:38px;height:3px;transform:translateX(-50%);background:currentColor}.F3 .char.selected .hinge::after{content:"";position:absolute;left:0;top:50%;width:3px;height:26px;transform:translateY(-50%);background:currentColor}.F4 .char.selected .hinge::after{content:"";position:absolute;left:50%;bottom:4px;width:29.4%;height:14px;transform:translateX(-50%);border-bottom:2px solid currentColor;border-radius:0 0 50% 50%}
.CINC .char.focus-fixture .namebox,.CINC .char.selected .namebox,.CINC .char:focus-visible .namebox{border:1px solid currentColor;border-radius:999px;background:#1d2025;padding:5px 6px}.CINC .char.focus-fixture .pool,.CINC .char.selected .pool,.CINC .char:focus-visible .pool{box-shadow:0 0 0 1px currentColor}.fixture-note{margin-top:9px;border-top:1px solid #2f3238;padding-top:7px;font-size:10px;line-height:1.4;color:var(--muted)}
@media(max-width:520px){body{padding:8px}.board{padding:9px}.board-head{display:block}.board-meta{text-align:left;margin-top:4px}.stage{padding:10px 4px}.cast{gap:4px;min-height:374px;flex-wrap:wrap}.char{width:92px;height:178px;flex:0 0 92px}.char-name{font-size:12px}.state-label{font-size:7px;letter-spacing:.07em}.namebox{min-height:38px}.F2 .char.selected .hinge::after{width:38px}.F3 .char.selected .hinge::after{height:26px}}
@media(forced-colors:active){:root{--page:Canvas;--panel:Canvas;--panel2:Canvas;--ink:CanvasText;--muted:CanvasText;--line:CanvasText;--beam:CanvasText;--pool:Canvas}.board,.stage{border-color:CanvasText}.beam{background:CanvasText;border-color:CanvasText;opacity:.18}.pool{background:Canvas;border-color:CanvasText}.CINC .char.focus-fixture .namebox,.CINC .char.selected .namebox,.CINC .char:focus-visible .namebox{background:Canvas;border-color:CanvasText}.fixture-note{border-color:CanvasText}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="intro"><h1>SEL-S1 — Stage Character Focus / Selection Hinge 01</h1><p>Neutral deterministic review surface. Focus uses one common structural ellipse for F1–F4. Persistent selection is the only scored candidate variable. Cone/pool/name/state geometry is fixed.</p></div>
<main class="boards" id="boards"></main>
<script>
const families=[['CNEG','No Authored Selection Witness','negative control'],['CINC','Incumbent Prototype Pill + Pool Outline','historical control'],['F1','Name Underline Witness','candidate'],['F2','Low Ground Edge Witness','candidate'],['F3','Lateral Ground Witness','candidate'],['F4','Shallow Ground Arc','candidate']];
const names=['Marlowe','Dr. Voss','Wren','Iona','Keir'];
const layouts=[
{id:'L2_SELECTED_RIGHT',count:2,states:['REST','LISTENING'],selected:1,focus:null,note:'Right Character selected; left default.'},
{id:'L3_FOCUS_LEFT',count:3,states:['REST','CURRENT OPPORTUNITY','LISTENING'],selected:null,focus:0,note:'Left Character keyboard-focus target; center Opportunity.'},
{id:'L4_FOCUS_SELECTED_THIRD',count:4,states:['REST','SPEAKING','LISTENING','REST'],selected:2,focus:2,note:'Third selected + keyboard focus; second Speaking.'},
{id:'L5_SELECTED_OPPORTUNITY_SECOND',count:5,states:['LISTENING','CURRENT OPPORTUNITY','REST','SPEAKING','LISTENING'],selected:1,focus:null,note:'Second selected + Opportunity; fourth Speaking.'},
{id:'L5_SELECTED_SPEAKING_FOURTH',count:5,states:['REST','LISTENING','CURRENT OPPORTUNITY','SPEAKING','LISTENING'],selected:3,focus:null,note:'Fourth selected + Speaking; third Opportunity.'}
];
function charMarkup(fam,layout,i){const selected=layout.selected===i,focus=layout.focus===i,state=layout.states[i],tab=focus?'0':'-1';const cls=['char'];if(selected)cls.push('selected');if(focus)cls.push('focus-fixture');return `<button class="${cls.join(' ')}" data-index="${i}" data-name="${names[i]}" data-state="${state}" data-selected="${selected}" data-focus-fixture="${focus}" tabindex="${tab}" aria-label="${names[i]}. ${state}. ${selected?'Selected for creator inspection. ':''}${focus?'Keyboard focus fixture. ':''}"><span class="beam"></span><span class="pool"></span><span class="hinge"><span class="namebox"><span class="char-name">${names[i]}</span><span class="state-label">${state}</span></span></span></button>`}
function boardMarkup(fam,name,role,layout){const selected=layout.selected==null?'none':names[layout.selected],focus=layout.focus==null?'none':names[layout.focus];const chars=Array.from({length:layout.count},(_,i)=>charMarkup(fam,layout,i)).join('');return `<section class="board family ${fam}" data-family="${fam}" data-layout="${layout.id}" data-count="${layout.count}" data-selected-index="${layout.selected??''}" data-focus-index="${layout.focus??''}"><div class="board-head"><div><div class="board-title">${fam} · ${name}</div><div class="fixture-note">${role}</div></div><div class="board-meta">${layout.id}<br>Selected: ${selected} · Focus: ${focus}</div></div><div class="stage"><div class="cast">${chars}</div><div class="fixture-note">${layout.note} Focus/selection are fixture conditions only; explicit Character state text is unchanged.</div></div></section>`}
const root=document.querySelector('#boards');for(const [fam,name,role] of families){for(const layout of layouts){root.insertAdjacentHTML('beforeend',boardMarkup(fam,name,role,layout))}}
window.__SEL_S1_META__={schema:'kymaean.sel-s1.harness-meta.v1',families:families.map(x=>x[0]),layouts:layouts.map(x=>x.id),boards:document.querySelectorAll('.board').length,characters:document.querySelectorAll('.char').length,selected:document.querySelectorAll('.char.selected').length,focusFixtures:document.querySelectorAll('.char.focus-fixture').length,keyboardTargets:document.querySelectorAll('.char[tabindex="0"]').length};
</script>
</body>
</html>
