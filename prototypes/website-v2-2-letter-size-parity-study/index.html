<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KYMÆAN V2.2 apparent-size parity study</title>
<style>
:root{--void:#090b0c;--ink:#ddd5c7;--muted:#8d887f}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:var(--void)}
body{color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
.scene{position:fixed;inset:0;overflow:hidden;background:var(--void)}
.scene-art{position:absolute;inset:0;display:block;width:100%;height:100%;object-fit:cover;object-position:50% 49%}
.scene:after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(6,8,9,.18) 0%,rgba(6,8,9,.05) 22%,transparent 42%),radial-gradient(ellipse at 50% 22%,rgba(0,0,0,.06),transparent 44%)}
.stage{position:relative;z-index:2;width:100%;height:100%}
.brand-lockup{position:absolute;top:14.5svh;left:50%;transform:translateX(-50%);display:flex;width:min(94vw,34rem);flex-direction:column;align-items:center;text-align:center}
.wordmark{display:block;width:min(32vw,30.5rem);min-width:22rem;height:auto;color:var(--ink)}
.wordmark-mark{fill:currentColor}.v,.d,.h,.fine{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
.v{stroke-width:5.9}.d{stroke-width:5.35}.h{stroke-width:4.55}.fine{stroke-width:2.35;opacity:.7}
.status{margin:.72rem 0 0;color:var(--muted);font-size:.69rem;font-weight:500;letter-spacing:.34em;line-height:1.4;text-transform:uppercase}
</style>
</head>
<body data-variant="A">
<div class="scene" aria-hidden="true"><img class="scene-art" src="../../site/public/stage-v2-2.webp" alt=""></div>
<main class="stage"><section class="brand-lockup">
<svg class="wordmark" viewBox="0 0 690 122" aria-hidden="true">
<g class="wordmark-mark" transform="translate(24 11.7) scale(.418)">
<path d="M65 15L54 21L52 23L47 25L45 27L40 29L38 31L33 33L31 35L26 37L24 39L21 40L19 42L10 47L10 116L23 109L28 105L31 104L49 92L55 86L61 77L61 75L63 72L64 65L65 64Z"/>
<path d="M10 126L10 192L16 196L19 197L21 199L24 200L26 202L29 203L31 205L41 210L43 212L48 214L55 219L65 224L65 179L64 178L63 171L60 164L55 158L55 157L50 152L22 133L19 132Z"/>
<path d="M160 22L88 64L77 74L71 84L68 94L67 140L71 158L84 175L161 221L161 201L156 188L148 180L100 152L89 140L84 127L85 111L94 95L102 88L148 62L156 54L161 42Z"/>
</g>
<g class="y"><path d="M118 18L156 62L194 18" class="d"/><path d="M156 62L156 104" class="v"/></g>
<g class="m"><path d="M220 104L220 18" class="v"/><path d="M220 18L262 58L304 18" class="d"/><path d="M304 18L304 104" class="v"/></g>
<g class="ae"><path d="M338 104L376 18" class="d"/><path d="M376 18L400 104" class="d"/><path d="M377 18L432 18" class="h"/><path d="M358 64L414 64" class="h"/><path d="M400 104L432 104" class="h"/><path d="M414 64L436 64" class="fine"/></g>
<g class="a"><path d="M462 104L501 18L540 104" class="d"/><path d="M480 64L522 64" class="h"/></g>
<g class="n"><path d="M570 104L570 18" class="v"/><path d="M570 18L648 104" class="d"/><path d="M648 104L648 18" class="v"/></g>
</svg>
<p class="status">Coming Soon</p>
</section></main>
<style>
@media (max-width:900px) and (orientation:portrait){
.brand-lockup{top:max(29.5svh,calc(env(safe-area-inset-top) + 1rem));left:50%;width:min(90vw,24rem)}
.wordmark{width:min(58vw,22rem);min-width:0}
.status{margin-top:clamp(.8rem,1.5svh,.95rem);font-size:clamp(.62rem,2.1vw,.72rem);letter-spacing:.38em}
.scene-art{inset:auto auto 0 50%;width:160vw;max-width:none;height:auto;transform:translateX(-50%);object-fit:contain;object-position:center;mask-image:linear-gradient(to bottom,transparent 0%,#000 18%,#000 100%)}
.scene:after{background:linear-gradient(to bottom,rgba(9,11,12,.12),transparent 45%)}
}
@media (min-width:600px) and (orientation:portrait){
.scene-art{inset:auto auto 0 50%;width:calc(200vw - 240px);max-width:none;height:auto;transform:translateX(-50%);object-fit:contain;object-position:center;mask-image:linear-gradient(to bottom,transparent 0%,#000 18%,#000 100%)}
.scene:after{background:linear-gradient(to bottom,rgba(9,11,12,.12),transparent 45%)}
}
</style>
<script>
const q=new URLSearchParams(location.search);
const variant=(q.get('variant')||'A').toUpperCase();
document.body.dataset.variant=['A','B','C'].includes(variant)?variant:'A';
document.querySelector('.ae').setAttribute('transform','translate(-3 0)');
document.querySelector('.a').setAttribute('transform','translate(-3 0)');
document.querySelector('.n').setAttribute('transform','translate(-4 0)');
const mark=document.querySelector('.wordmark-mark');
const factors={A:1,B:1.03,C:1.05};
const factor=factors[document.body.dataset.variant];
const box=mark.getBBox();
const base={tx:24,ty:11.7,s:.418};
const anchorX=base.tx+base.s*(box.x+box.width/2);
const anchorBottom=base.ty+base.s*(box.y+box.height);
const s=base.s*factor;
const tx=anchorX-s*(box.x+box.width/2);
const ty=anchorBottom-s*(box.y+box.height);
mark.setAttribute('transform',`translate(${tx} ${ty}) scale(${s})`);
document.documentElement.dataset.studyVariant=document.body.dataset.variant;
</script>
</body></html>
