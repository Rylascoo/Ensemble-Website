<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLR-01 deterministic color-logic specimen harness</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#111;font-family:system-ui,sans-serif}body{padding:0}.specimen{margin:0 0 28px}.chrome{font:400 14px/1.4 system-ui,sans-serif;color:#111;background:#fff;padding:8px 0;margin:0;overflow-wrap:anywhere}.frame{height:720px;position:relative;overflow:hidden}.panel{position:absolute;top:72px;left:50%;transform:translateX(-50%);border:1px solid var(--boundary);border-radius:10px;background:var(--field);color:var(--primary);padding:32px}.accent-strip{display:block;width:32px;height:3px;background:var(--accent);margin:0 0 16px}.heading{margin:0 0 14px;font:650 32px/1.15 system-ui,sans-serif;color:var(--primary)}.body{margin:0 0 28px;font:400 16px/1.5 system-ui,sans-serif;color:var(--primary)}.rows{border-top:1px solid var(--boundary)}.row{min-height:84px;padding:14px 16px;border-bottom:1px solid var(--boundary);display:flex;flex-direction:column;justify-content:center}.row.soft{background:var(--soft)}.label{font:650 13px/1.3 system-ui,sans-serif;color:var(--secondary);margin:0 0 6px}.text{font:400 16px/1.4 system-ui,sans-serif;color:var(--primary);margin:0}.row.secondary .text{color:var(--secondary)}.action{display:inline-block;margin-top:24px;padding:11px 16px;border:2px solid var(--accent);border-radius:8px;background:var(--field);color:var(--accent);font:650 15px/1.2 system-ui,sans-serif;box-shadow:none;filter:none;transition:none;animation:none}.action:focus-visible{outline:3px double var(--accent);outline-offset:3px}.frame.web-wide{width:1280px}.web-wide .panel{width:720px}.frame.app-wide{width:1024px}.app-wide .panel{width:680px}.frame.reflow{width:320px;overflow-x:hidden;overflow-y:visible}.reflow .panel{width:288px;padding:20px}.reflow .heading{font-size:32px}
@media (forced-colors:active){.accent-strip{display:none}.frame,.panel,.row,.action{forced-color-adjust:auto}.action:focus-visible{outline:3px double Highlight;outline-offset:3px}}
#diagnostic-report{white-space:pre-wrap;font:12px/1.3 monospace}
</style></head><body><main id="root"></main><pre id="diagnostic-report" hidden></pre>
<script>'use strict';
const F={
CNEG:{APP:{field:'#F7F7F7',primary:'#1D1D1D',secondary:'#575757',accent:'#444444',boundary:'#7A7A7A',soft:'#ECECEC'},WEB:{field:'#F7F7F7',primary:'#1D1D1D',secondary:'#575757',accent:'#444444',boundary:'#7A7A7A',soft:'#ECECEC'}},
CCONV:{APP:{field:'#F7F8FA',primary:'#1C2028',secondary:'#59616F',accent:'#2F5FA8',boundary:'#7D8795',soft:'#E8EEF8'},WEB:{field:'#F5F8FC',primary:'#18202C',secondary:'#526172',accent:'#2463EB',boundary:'#73839A',soft:'#E2ECFB'}},
F1:{APP:{field:'#F7F5F2',primary:'#191B24',secondary:'#565B67',accent:'#9A4D2E',boundary:'#8A8178',soft:'#EEE8E2'},WEB:{field:'#F6F0E9',primary:'#1D1B20',secondary:'#5B5254',accent:'#A04725',boundary:'#8C7B71',soft:'#F0E3D9'}},
F2:{APP:{field:'#F4F3F7',primary:'#221B2D',secondary:'#5C5565',accent:'#006F73',boundary:'#7D7486',soft:'#EAE8EF'},WEB:{field:'#F1EDF6',primary:'#21172C',secondary:'#5A5065',accent:'#006D70',boundary:'#766D82',soft:'#E9E3F0'}},
F3:{APP:{field:'#F4F8F5',primary:'#16231F',secondary:'#4D5E58',accent:'#7D3A6D',boundary:'#72827A',soft:'#E6EFE9'},WEB:{field:'#EFF7F2',primary:'#14251E',secondary:'#465951',accent:'#8C326E',boundary:'#6D8076',soft:'#E0EFE5'}},
F4:{APP:{field:'#F8F5F0',primary:'#24201B',secondary:'#5A544B',accent:'#3E5D9B',boundary:'#6F7F99',soft:'#E7EBF3'},WEB:{field:'#F6F1E8',primary:'#211E19',secondary:'#564F45',accent:'#355EB0',boundary:'#687DA5',soft:'#E1E7F2'}}};
const families=['CNEG','CCONV','F1','F2','F3','F4'],contexts=['APP','WEB'],views=['WIDE','REFLOW_320'];
function specimenId(f,c,v){return `${f}-${c}-${v}`}
function mount(family,context,viewport){const id=specimenId(family,context,viewport),v=F[family][context],sec=document.createElement('section');sec.className='specimen';sec.dataset.specimenId=id;const chrome=document.createElement('div');chrome.className='chrome';chrome.textContent=id;const frame=document.createElement('div');frame.className=`frame ${context==='WEB'&&viewport==='WIDE'?'web-wide':context==='APP'&&viewport==='WIDE'?'app-wide':'reflow'}`;frame.style.setProperty('--field',v.field);frame.style.setProperty('--primary',v.primary);frame.style.setProperty('--secondary',v.secondary);frame.style.setProperty('--accent',v.accent);frame.style.setProperty('--boundary',v.boundary);frame.style.setProperty('--soft',v.soft);const panel=document.createElement('article');panel.className='panel';panel.innerHTML=`<span class="accent-strip" aria-hidden="true"></span><h1 class="heading">A field holds several related parts.</h1><p class="body">Each part remains distinct while sharing one context.</p><div class="rows"><section class="row primary"><p class="label">Primary note</p><p class="text">A relationship remains visible.</p></section><section class="row secondary"><p class="label">Secondary note</p><p class="text">Another detail remains present.</p></section><section class="row soft"><p class="label">Reference</p><p class="text">The surrounding field stays quiet.</p></section></div><button class="action" type="button">Open another view</button>`;frame.append(panel);sec.append(chrome,frame);document.getElementById('root').append(sec);return{family,context,viewport,id,sec,chrome,frame,panel,action:panel.querySelector('.action'),strip:panel.querySelector('.accent-strip'),rows:[...panel.querySelectorAll('.row')]};}
function css(el){const s=getComputedStyle(el);return{color:s.color,backgroundColor:s.backgroundColor,borderTopColor:s.borderTopColor,borderTopStyle:s.borderTopStyle,borderTopWidth:s.borderTopWidth,borderBottomColor:s.borderBottomColor,borderBottomStyle:s.borderBottomStyle,borderBottomWidth:s.borderBottomWidth,borderColor:s.borderColor,borderStyle:s.borderStyle,borderWidth:s.borderWidth,outlineColor:s.outlineColor,outlineStyle:s.outlineStyle,outlineWidth:s.outlineWidth,display:s.display,fontFamily:s.fontFamily,filter:s.filter,boxShadow:s.boxShadow,animationName:s.animationName,transitionDuration:s.transitionDuration,backgroundImage:s.backgroundImage}}
function reportOne(s){s.action.focus();const r=s.frame.getBoundingClientRect(),p=s.panel.getBoundingClientRect(),a=s.action.getBoundingClientRect(),fs=getComputedStyle(s.frame);return{id:s.id,family:s.family,context:s.context,viewport:s.viewport,forcedColors:matchMedia('(forced-colors: active)').matches,frame:{width:r.width,height:r.height,scrollWidth:s.frame.scrollWidth,scrollHeight:s.frame.scrollHeight,overflowX:fs.overflowX,overflowY:fs.overflowY},panel:{left:p.left-r.left,top:p.top-r.top,bottom:p.bottom-r.top,width:p.width,height:p.height,scrollWidth:s.panel.scrollWidth,scrollHeight:s.panel.scrollHeight,style:css(s.panel)},heading:css(s.panel.querySelector('.heading')),body:css(s.panel.querySelector('.body')),labels:[...s.panel.querySelectorAll('.label')].map(css),texts:[...s.panel.querySelectorAll('.text')].map(css),rows:s.rows.map(x=>({style:css(x),rect:(()=>{const q=x.getBoundingClientRect();return{width:q.width,height:q.height}})()})),action:{style:css(s.action),focused:document.activeElement===s.action,text:s.action.textContent,rect:{top:a.top-r.top,bottom:a.bottom-r.top,width:a.width,height:a.height}},strip:css(s.strip),textContent:s.panel.innerText};}
const q=new URLSearchParams(location.search),diag=q.get('diagnostic')==='1',one=q.get('specimen'),fam=q.get('family');let mounted=[];
if(diag){for(const f of families)for(const c of contexts)for(const v of views)mounted.push(mount(f,c,v));const report={schema:'kymaean.clr01.browser-diagnostic.v1',forcedColors:matchMedia('(forced-colors: active)').matches,userAgent:navigator.userAgent,platform:navigator.platform,devicePixelRatio,innerWidth,innerHeight,specimens:mounted.map(reportOne)};const pre=document.getElementById('diagnostic-report');pre.hidden=false;pre.textContent=JSON.stringify(report);}else if(one){const [f,c,...tail]=one.split('-');mount(f,c,tail.join('-'));}else if(fam&&families.includes(fam)){for(const c of contexts)for(const v of views)mounted.push(mount(fam,c,v));}else{for(const f of families)for(const c of contexts)for(const v of views)mounted.push(mount(f,c,v));}
</script></body></html>
