<text x="80" y="68" class="title">KYMÆAN Lettering Master Study 03 — Bespoke Synthesis R3</text>
<text x="80" y="102" class="subtitle">Exact fixed K · monochrome · bespoke supporting word · restrained optical synthesis of Study 02 survivors</text>
<g fill="#17191B" transform="translate(90,180)"><use href="#word"/></g>
<line x1="80" y1="470" x2="1520" y2="470" stroke="#D4D0C8"/>
<text x="80" y="505" class="subtitle">Incised discipline sets proportion and bar hierarchy; Mineral humanism enters only through taper, optical asymmetry and living white space.</text>
<text x="80" y="532" class="subtitle">No cut motif or display trick is allowed to become the identity.</text>
<text x="80" y="650" class="proof-label">word-rhythm proofs — K/Y transition · MA · AE · EA · AN</text>
