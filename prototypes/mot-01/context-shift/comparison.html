<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOT-01 context-shift differentiation comparison</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#111;font-family:system-ui,sans-serif}body{padding:20px}button{font:500 14px/1.2 system-ui,sans-serif;padding:8px 11px;background:#fff;color:#111;border:1px solid #aaa;border-radius:6px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar button[aria-pressed="true"]{border-color:#111;font-weight:700}.intro{max-width:86ch;font:400 14px/1.5 system-ui,sans-serif;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}.case{min-width:0;border:1px solid #ddd;padding:14px}.case h2{font:650 16px/1.25 system-ui,sans-serif;margin:0 0 4px}.class{font:700 11px/1.2 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}.desc{font:400 13px/1.45 system-ui,sans-serif;margin:0 0 10px;max-width:66ch}.surface-shell{overflow:auto;max-width:100%;margin-top:10px}.surface{position:relative;background:#f5f5f5;min-height:250px;padding:18px;overflow:hidden}.field-host{position:relative;height:194px;overflow:hidden}.field{position:absolute;inset:0;background:#fff;border:1px solid #cfcfcf;padding:16px;transform:translateY(0);opacity:1}.field h3{font:650 15px/1.2 system-ui,sans-serif;margin:0 0 6px}.field p{font:400 12px/1.4 system-ui,sans-serif;margin:0 0 12px;max-width:52ch}.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.tile{min-width:0;border:1px solid #ddd;background:#fafafa;padding:9px}.tile strong{display:block;font:650 11px/1.2 system-ui,sans-serif;margin-bottom:4px}.tile span{display:block;font:400 11px/1.3 system-ui,sans-serif}.legend{font:400 12px/1.4 system-ui,sans-serif;margin:10px 0 0}.diagnostic-host{display:none}#diagnostic-report{white-space:pre-wrap;font:12px/1.3 monospace}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div id="review-ui">
 <div class="toolbar"><button id="replay-all" type="button">Replay all</button><span>Context:</span><button class="ctx" data-value="APP" aria-pressed="true" type="button">APP</button><button class="ctx" data-value="WEB" aria-pressed="false" type="button">WEB</button><span>Viewport:</span><button class="view" data-value="WIDE" aria-pressed="true" type="button">WIDE</button><button class="view" data-value="REFLOW_320" aria-pressed="false" type="button">320</button></div>
 <p class="intro">These examples test a different treatment for a genuine shift between two already-ready contexts. F1A Ordered Stagger is not used. CS0 is the no-motion baseline; CS1–CS3 all use the same 280 ms timing so the mechanism—not speed—drives the comparison. No example autoplays.</p>
 <main class="grid" id="grid"></main>
</div>
<div class="diagnostic-host" id="diagnostic-host"></div><pre id="diagnostic-report" hidden></pre>
<script>'use strict';
const DURATION=280,EASING='cubic-bezier(0.2,0,0,1)',COMMON={duration:DURATION,delay:0,easing:EASING,iterations:1,fill:'forwards'};
const CONTEXTS={APP:{dy:16},WEB:{dy:32}},VIEWS={WIDE:{width:640},REFLOW_320:{width:320}};
const CASES={
 CS0_CUT:{label:'CS0 · Immediate Cut',classification:'NO-MOTION CONTROL',desc:'Context A is replaced synchronously by Context B. No transition animation is created.',legend:'Question: is no animation clearer and more appropriate than any candidate?'},
 CS1_SYNCHRONIZED_SETTLE:{label:'CS1 · Synchronized Field Settle',classification:'CANDIDATE',desc:'Context A is removed, then the entire incoming Context B field settles into place as one synchronized block.',legend:'Tests a restrained field-level arrival without element sequence.'},
 CS2_BALANCED_EXCHANGE:{label:'CS2 · Balanced Crossfade Exchange',classification:'CANDIDATE',desc:'Context A and Context B exchange opacity simultaneously while occupying the same fixed geometry.',legend:'Tests context change without directional travel or succession.'},
 CS3_OPPOSED_FIELD_EXCHANGE:{label:'CS3 · Simultaneous Opposed-Field Exchange',classification:'CANDIDATE',desc:'The outgoing and incoming fields move simultaneously in opposite vertical directions with equal timing.',legend:'Tests a stronger context boundary while monitoring false spatial/navigation meaning.'}
};
const media=matchMedia('(prefers-reduced-motion: reduce)'),mounted=new Map();
function makeField(which){const f=document.createElement('section');f.className='field';f.dataset.field=which;const h=document.createElement('h3');h.textContent=`Context ${which}`;const p=document.createElement('p');p.textContent=which==='A'?'A complete neutral context is currently established.':'A different complete neutral context is now established.';const tiles=document.createElement('div');tiles.className='tiles';[['Overview',which==='A'?'Stable summary A':'Stable summary B'],['Details',which==='A'?'Neutral detail A':'Neutral detail B'],['Notes',which==='A'?'Available note A':'Available note B']].forEach(([a,b])=>{const t=document.createElement('div');t.className='tile';const s=document.createElement('strong');s.textContent=a;const x=document.createElement('span');x.textContent=b;t.append(s,x);tiles.append(t)});f.append(h,p,tiles);return f}
function cancel(s){for(const el of [s.a,s.b])for(const an of el.getAnimations())an.cancel()}
function showA(s){cancel(s);s.a.hidden=false;s.b.hidden=false;s.a.style.transform='translateY(0px)';s.a.style.opacity='1';s.b.style.transform='translateY(0px)';s.b.style.opacity='0';s.a.style.pointerEvents='auto';s.b.style.pointerEvents='none'}
function showB(s){cancel(s);s.a.hidden=false;s.b.hidden=false;s.a.style.transform='translateY(0px)';s.a.style.opacity='0';s.b.style.transform='translateY(0px)';s.b.style.opacity='1';s.a.style.pointerEvents='none';s.b.style.pointerEvents='auto'}
function play(s){showA(s);if(media.matches||s.id==='CS0_CUT'){showB(s);return;}if(s.id==='CS1_SYNCHRONIZED_SETTLE'){s.a.style.opacity='0';s.b.style.opacity='1';s.b.style.transform=`translateY(${-s.dy}px)`;s.b.animate([{transform:`translateY(${-s.dy}px)`},{transform:'translateY(0px)'}],COMMON)}else if(s.id==='CS2_BALANCED_EXCHANGE'){s.a.animate([{opacity:1},{opacity:0}],COMMON);s.b.animate([{opacity:0},{opacity:1}],COMMON)}else{s.a.style.opacity='1';s.b.style.opacity='1';s.b.style.transform=`translateY(${-s.dy}px)`;s.a.animate([{transform:'translateY(0px)'},{transform:`translateY(${s.dy}px)`}],COMMON);s.b.animate([{transform:`translateY(${-s.dy}px)`},{transform:'translateY(0px)'}],COMMON)}}
function mountCase(id,ctx,view,host){const def=CASES[id],card=document.createElement('section');card.className='case';const h=document.createElement('h2');h.textContent=def.label;const cl=document.createElement('p');cl.className='class';cl.textContent=def.classification;const desc=document.createElement('p');desc.className='desc';desc.textContent=def.desc;const b=document.createElement('button');b.type='button';b.textContent='Replay context shift';const shell=document.createElement('div');shell.className='surface-shell';const surface=document.createElement('div');surface.className='surface';surface.style.width=`${VIEWS[view].width}px`;const fh=document.createElement('div');fh.className='field-host';const a=makeField('A'),incoming=makeField('B');fh.append(a,incoming);surface.append(fh);shell.append(surface);const legend=document.createElement('p');legend.className='legend';legend.textContent=def.legend;card.append(h,cl,desc,b,shell,legend);host.append(card);const s={id,ctx,view,def,card,button:b,surface,a,b:incoming,dy:CONTEXTS[ctx].dy};mounted.set(`${id}-${ctx}-${view}`,s);showA(s);b.addEventListener('click',()=>play(s));return s}
let currentCtx='APP',currentView='WIDE';function renderReview(){mounted.clear();const grid=document.getElementById('grid');grid.textContent='';Object.keys(CASES).forEach(id=>mountCase(id,currentCtx,currentView,grid))}function choose(kind,val){if(kind==='ctx')currentCtx=val;else currentView=val;document.querySelectorAll(`.${kind}`).forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.value===val)));renderReview()}
document.querySelectorAll('.ctx').forEach(b=>b.addEventListener('click',()=>choose('ctx',b.dataset.value)));document.querySelectorAll('.view').forEach(b=>b.addEventListener('click',()=>choose('view',b.dataset.value)));document.getElementById('replay-all').addEventListener('click',()=>mounted.forEach(play));media.addEventListener('change',e=>{if(e.matches)mounted.forEach(showB)});
function m42(el){const tr=getComputedStyle(el).transform;return tr==='none'?0:new DOMMatrixReadOnly(tr).m42}function effects(el){return el.getAnimations().map(an=>{const t=an.effect.getTiming();return{delay:t.delay,duration:t.duration,easing:t.easing,fill:t.fill,keyframes:an.effect.getKeyframes().map(k=>({offset:k.offset,transform:k.transform??null,opacity:k.opacity??null}))}})}
async function diagnostic(){document.getElementById('review-ui').hidden=true;const host=document.getElementById('diagnostic-host');host.style.display='block';mounted.clear();const rows=[];for(const id of Object.keys(CASES))for(const ctx of Object.keys(CONTEXTS))for(const view of Object.keys(VIEWS)){const s=mountCase(id,ctx,view,host);const initial=s.surface.getAnimations({subtree:true}).length;s.button.focus();const focusBefore=document.activeElement===s.button;play(s);const focusAfter=document.activeElement===s.button;rows.push({key:`${id}-${ctx}-${view}`,id,ctx,view,width:s.surface.clientWidth,scrollWidth:s.surface.scrollWidth,initialAnimations:initial,focusBefore,focusAfter,animationsAfter:s.surface.getAnimations({subtree:true}).length,aEffects:effects(s.a),bEffects:effects(s.b)})}for(const s of mounted.values())for(const el of [s.a,s.b])for(const an of el.getAnimations())an.currentTime=DURATION;const by=Object.fromEntries(rows.map(r=>[r.key,r]));for(const [key,s] of mounted)by[key].final={a:{y:m42(s.a),opacity:Number(getComputedStyle(s.a).opacity)},b:{y:m42(s.b),opacity:Number(getComputedStyle(s.b).opacity)}};const report={schema:'kymaean.mot01.context-shift-diagnostic.v1',reduced:media.matches,userAgent:navigator.userAgent,platform:navigator.platform,rows};const pre=document.getElementById('diagnostic-report');pre.hidden=false;pre.textContent=JSON.stringify(report)}
const q=new URLSearchParams(location.search);if(q.get('diagnostic')==='1')diagnostic();else renderReview();
</script></body></html>
