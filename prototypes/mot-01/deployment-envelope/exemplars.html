<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOT-01 F1A deployment-envelope exemplars</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#111;font-family:system-ui,sans-serif}body{padding:20px}button{font:500 14px/1.2 system-ui,sans-serif;padding:8px 11px;background:#fff;color:#111;border:1px solid #aaa;border-radius:6px}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.toolbar button[aria-pressed="true"]{border-color:#111;font-weight:700}.intro{max-width:82ch;font:400 14px/1.5 system-ui,sans-serif;margin:0 0 18px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}.case{min-width:0;border:1px solid #ddd;padding:14px}.case.negative{border-style:dashed}.case h2{font:650 16px/1.25 system-ui,sans-serif;margin:0 0 4px}.class{font:700 11px/1.2 system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;margin:0 0 8px}.desc{font:400 13px/1.45 system-ui,sans-serif;margin:0 0 10px;max-width:64ch}.surface-shell{overflow:auto;max-width:100%;margin-top:10px}.surface{position:relative;background:#f7f7f7;min-height:230px;padding:28px 24px 24px;overflow:hidden}.row{display:flex;gap:12px;align-items:stretch;flex-wrap:nowrap}.unit{background:#e5e5e5;border:1px solid #ccc;min-width:0;color:#111;transform:translateY(0);opacity:1}.peer{width:96px;height:76px;display:grid;place-items:center;font:650 18px/1 system-ui,sans-serif}.step{width:150px;min-height:82px;padding:14px}.step strong{display:block;font:650 14px/1.2 system-ui,sans-serif;margin-bottom:5px}.step span{font:400 12px/1.35 system-ui,sans-serif}.groups{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.group{padding:12px;min-height:118px}.group strong{display:block;font:650 13px/1.2 system-ui,sans-serif;margin-bottom:8px}.group span{display:block;font:400 12px/1.35 system-ui,sans-serif;padding:3px 0}.list{display:grid;gap:7px;max-width:420px}.list .unit{padding:9px 12px;font:500 13px/1.2 system-ui,sans-serif}.process{display:flex;gap:8px;align-items:center;flex-wrap:nowrap}.process .unit{width:104px;padding:12px 8px;text-align:center;font:600 12px/1.2 system-ui,sans-serif}.legend{font:400 12px/1.4 system-ui,sans-serif;margin:10px 0 0}.negative .legend{font-weight:600}.diagnostic-host{display:none}#diagnostic-report{white-space:pre-wrap;font:12px/1.3 monospace}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body>
<div id="review-ui">
 <div class="toolbar"><button id="replay-all" type="button">Replay all</button><span>Context:</span><button class="ctx" data-value="APP" aria-pressed="true" type="button">APP</button><button class="ctx" data-value="WEB" aria-pressed="false" type="button">WEB</button><span>Viewport:</span><button class="view" data-value="WIDE" aria-pressed="true" type="button">WIDE</button><button class="view" data-value="REFLOW_320" aria-pressed="false" type="button">320</button></div>
 <p class="intro">These examples test where F1A Tight belongs. A1–A3 obey the frozen deployment envelope. N1–N2 intentionally violate one rule each so the boundary can be judged directly. Cadence is fixed at 70 ms onset spacing and 460 ms equal movement; no example autoplays.</p>
 <main class="grid" id="grid"></main>
</div>
<div class="diagnostic-host" id="diagnostic-host"></div><pre id="diagnostic-report" hidden></pre>
<script>'use strict';
const EASING='cubic-bezier(0.2,0,0,1)',DURATION=460,INTERVAL=70,COMMON={iterations:1,direction:'normal',fill:'forwards',composite:'replace',iterationComposite:'replace'};
const CONTEXTS={APP:{dy:28},WEB:{dy:56}},VIEWS={WIDE:{width:640},REFLOW_320:{width:320}};
const CASES={
 A1_PEER_CONSTELLATION:{label:'A1 · Peer constellation',classification:'ELIGIBLE CANDIDATE',negative:false,kind:'peers',units:['A','B','C','D'],desc:'Four visual peers enter as one identity-bearing statement. The order is symbolic; no item claims functional priority.',legend:'Envelope test: direct F1A across four peer units.'},
 A2_EXPLICIT_EXPLANATORY_ORDER:{label:'A2 · Explicit explanatory order',classification:'ELIGIBLE CANDIDATE',negative:false,kind:'steps',units:[['Earlier','A condition already existed.'],['Current','The present state is visible.'],['Next','A later possibility remains.']],desc:'Three explanatory units already have an explicit temporal order in their text. Motion follows that order rather than inventing it.',legend:'Envelope test: direct F1A follows pre-existing explanatory order.'},
 A3_PREEXISTING_GROUP_BATCH:{label:'A3 · Pre-existing group batch',classification:'ELIGIBLE CANDIDATE',negative:false,kind:'groups',units:[['Group A','Item 1','Item 2'],['Group B','Item 3','Item 4','Item 5'],['Group C','Item 6','Item 7']],desc:'Seven content items remain static inside three independently meaningful groups. F1A sequences the group containers, never the seven rows.',legend:'Envelope test: lawful 5+ handling through three pre-existing groups.'},
 N1_SIX_ROW_DIRECT_CASCADE:{label:'N1 · Six-row direct cascade',classification:'NEGATIVE CONTROL · PROHIBITED',negative:true,kind:'list',units:['Result 1','Result 2','Result 3','Result 4','Result 5','Result 6'],violation:'DIRECT_UNIT_COUNT_GT_4',desc:'The same 70 ms cadence is applied directly to six routine rows. This intentionally violates the 2–4 direct-unit cap.',legend:'Violation under test: arbitrary per-row cascade becomes generic and extends the onset train.'},
 N2_FAKE_PROCESS_SEQUENCE:{label:'N2 · Fake process sequence',classification:'NEGATIVE CONTROL · PROHIBITED',negative:true,kind:'process',units:['Prepare','Process','Verify','Ready'],violation:'FALSE_PROCESS_SEMANTICS',desc:'The same F1A rhythm is attached to operational-sounding statuses. It intentionally risks implying actual staged processing.',legend:'Violation under test: motion fabricates functional sequence semantics.'}
};
const media=matchMedia('(prefers-reduced-motion: reduce)'),mounted=new Map();
function cancel(s){for(const el of s.movers)for(const a of el.getAnimations())a.cancel()}
function start(s){cancel(s);for(const el of s.movers){el.style.transform='translateY(0px)';el.style.opacity='1'}}
function finish(s){cancel(s);for(const el of s.movers){el.style.transform=`translateY(${s.dy}px)`;el.style.opacity='1'}}
function play(s){start(s);if(media.matches){finish(s);return;}s.movers.forEach((el,i)=>el.animate([{transform:'translateY(0px)'},{transform:`translateY(${s.dy}px)`}],{...COMMON,duration:DURATION,delay:i*INTERVAL,easing:EASING}));}
function unit(tag='div',cls='unit'){const e=document.createElement(tag);e.className=cls;return e}
function buildContent(def){const movers=[];let content;
 if(def.kind==='peers'){content=unit('div','row');for(const x of def.units){const e=unit('div','unit peer');e.textContent=x;content.append(e);movers.push(e)}}
 else if(def.kind==='steps'){content=unit('div','row');for(const [h,t] of def.units){const e=unit('div','unit step'),a=document.createElement('strong'),b=document.createElement('span');a.textContent=h;b.textContent=t;e.append(a,b);content.append(e);movers.push(e)}}
 else if(def.kind==='groups'){content=unit('div','groups');for(const g of def.units){const e=unit('div','unit group'),h=document.createElement('strong');h.textContent=g[0];e.append(h);for(const item of g.slice(1)){const s=document.createElement('span');s.textContent=item;e.append(s)}content.append(e);movers.push(e)}}
 else if(def.kind==='list'){content=unit('div','list');for(const x of def.units){const e=unit();e.textContent=x;content.append(e);movers.push(e)}}
 else{content=unit('div','process');for(const x of def.units){const e=unit();e.textContent=x;content.append(e);movers.push(e)}}
 return{content,movers};}
function mountCase(id,ctx,view,host,review=true){const def=CASES[id],card=document.createElement('section');card.className='case'+(def.negative?' negative':'');const h=document.createElement('h2');h.textContent=def.label;const cl=document.createElement('p');cl.className='class';cl.textContent=def.classification;const desc=document.createElement('p');desc.className='desc';desc.textContent=def.desc;const b=document.createElement('button');b.type='button';b.textContent='Replay';const shell=document.createElement('div');shell.className='surface-shell';const surface=document.createElement('div');surface.className='surface';surface.style.width=`${VIEWS[view].width}px`;const built=buildContent(def);surface.append(built.content);shell.append(surface);const legend=document.createElement('p');legend.className='legend';legend.textContent=def.legend;card.append(h,cl,desc,b,shell,legend);host.append(card);const s={id,ctx,view,def,card,button:b,surface,movers:built.movers,dy:CONTEXTS[ctx].dy};mounted.set(`${id}-${ctx}-${view}`,s);b.addEventListener('click',()=>play(s));return s;}
let currentCtx='APP',currentView='WIDE';function renderReview(){mounted.clear();const grid=document.getElementById('grid');grid.textContent='';for(const id of Object.keys(CASES))mountCase(id,currentCtx,currentView,grid)}
function choose(kind,val){if(kind==='ctx')currentCtx=val;else currentView=val;for(const b of document.querySelectorAll(`.${kind}`))b.setAttribute('aria-pressed',String(b.dataset.value===val));renderReview()}
document.querySelectorAll('.ctx').forEach(b=>b.addEventListener('click',()=>choose('ctx',b.dataset.value)));document.querySelectorAll('.view').forEach(b=>b.addEventListener('click',()=>choose('view',b.dataset.value)));document.getElementById('replay-all').addEventListener('click',()=>mounted.forEach(play));media.addEventListener('change',e=>{if(e.matches)mounted.forEach(finish)});
function m42(el){const tr=getComputedStyle(el).transform;return tr==='none'?0:new DOMMatrixReadOnly(tr).m42}
function dumpEffects(el){return el.getAnimations().map(a=>{const t=a.effect.getTiming();return{delay:t.delay,duration:t.duration,easing:t.easing,fill:t.fill,iterations:t.iterations,keyframes:a.effect.getKeyframes().map(k=>({offset:k.offset,transform:k.transform??null}))}})}
async function diagnostic(){document.getElementById('review-ui').hidden=true;const host=document.getElementById('diagnostic-host');host.style.display='block';mounted.clear();const rows=[];
 for(const id of Object.keys(CASES))for(const ctx of Object.keys(CONTEXTS))for(const view of Object.keys(VIEWS)){const s=mountCase(id,ctx,view,host,false),def=s.def;const initial=s.surface.getAnimations({subtree:true}).length;s.button.focus();const focusBefore=document.activeElement===s.button;play(s);const focusAfter=document.activeElement===s.button;rows.push({key:`${id}-${ctx}-${view}`,caseId:id,classification:def.classification,negative:def.negative,violation:def.violation??null,context:ctx,viewport:view,width:s.surface.clientWidth,scrollWidth:s.surface.scrollWidth,initialAnimations:initial,focusBefore,focusAfter,animationsAfter:s.surface.getAnimations({subtree:true}).length,moverCount:s.movers.length,effects:s.movers.map(dumpEffects)})}
 for(const s of mounted.values())for(const el of s.movers)for(const a of el.getAnimations()){const t=a.effect.getTiming();a.currentTime=Number(t.delay)+Number(t.duration)}
 const by=Object.fromEntries(rows.map(r=>[r.key,r]));for(const [key,s] of mounted){by[key].final=s.movers.map(el=>({translateY:m42(el),opacity:Number(getComputedStyle(el).opacity),animations:el.getAnimations().length,playStates:el.getAnimations().map(a=>a.playState)}))}
 const report={schema:'kymaean.mot01.f1a-envelope-exemplar-diagnostic.v1',reduced:media.matches,userAgent:navigator.userAgent,platform:navigator.platform,devicePixelRatio,rows};const pre=document.getElementById('diagnostic-report');pre.hidden=false;pre.textContent=JSON.stringify(report)}
const q=new URLSearchParams(location.search);if(q.get('diagnostic')==='1')diagnostic();else renderReview();
</script></body></html>
