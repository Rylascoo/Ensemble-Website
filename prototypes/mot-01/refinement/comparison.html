<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOT-01 F1 refinement comparison</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#111;font-family:system-ui,sans-serif}
body{padding:20px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0 0 18px}
button{font:500 14px/1.2 system-ui,sans-serif;padding:8px 11px;background:#fff;color:#111;border:1px solid #aaa;border-radius:6px}
button[aria-pressed="true"]{border-color:#111;font-weight:700}.note{font:400 13px/1.45 system-ui,sans-serif;max-width:78ch;margin:0 0 18px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px;align-items:start}.card{min-width:0}
.card h2{font:650 15px/1.3 system-ui,sans-serif;margin:0 0 4px}.meta{font:400 12px/1.4 system-ui,sans-serif;margin:0 0 8px}
.canvas-shell{overflow:auto;max-width:100%;border:1px solid #ddd;background:#fff}.scored-canvas{position:relative;margin:0;background:#fff;overflow:visible;border:0}
.token{position:absolute;top:72px;width:36px;height:36px;background:#e6e6e6;color:#111;font:600 14px/36px system-ui,sans-serif;text-align:center;border:0;box-shadow:none;transform-origin:center;opacity:1}
#diagnostic-report{white-space:pre-wrap;font:12px/1.3 monospace}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
</style></head>
<body>
<div id="review-ui">
  <div class="toolbar" aria-label="Comparison controls">
    <button id="replay-all" type="button">Replay all</button>
    <span>Context:</span><button class="ctx" data-value="WEB" aria-pressed="true" type="button">WEB</button><button class="ctx" data-value="APP" aria-pressed="false" type="button">APP</button>
    <span>Viewport:</span><button class="view" data-value="WIDE" aria-pressed="true" type="button">WIDE</button><button class="view" data-value="REFLOW_320" aria-pressed="false" type="button">320</button>
  </div>
  <p class="note">F1A, F1B and F1C preserve the same Ordered Stagger mechanism and differ only in onset interval + equal per-item movement duration. F4 is the frozen secondary reference. No variant autoplays.</p>
  <main class="grid" id="grid"></main>
</div>
<pre id="diagnostic-report" hidden></pre>
<script>'use strict';
const EASING='cubic-bezier(0.2,0,0,1)', COMMON={iterations:1,direction:'normal',fill:'forwards',composite:'replace',iterationComposite:'replace'};
const VARIANTS={
 F1A:{label:'F1A · Tight',family:'F1',duration:460,delays:[0,70,140,210],last:670},
 F1B:{label:'F1B · Reference',family:'F1',duration:520,delays:[0,90,180,270],last:790},
 F1C:{label:'F1C · Measured',family:'F1',duration:560,delays:[0,110,220,330],last:890},
 F4:{label:'F4 · Continuous Velocity reference',family:'F4',duration:620,delays:[0,0,0,0],last:620}
};
const CONTEXTS={WEB:{dy:56},APP:{dy:28}}, VIEWS={WIDE:{width:640,height:240},REFLOW_320:{width:320,height:240}};
const media=matchMedia('(prefers-reduced-motion: reduce)'), mounted=new Map();
function startLeft(w){return (w-192)/2}
function cancelAll(s){for(const t of s.tokens)for(const a of t.getAnimations())a.cancel()}
function setStart(s){cancelAll(s);for(const t of s.tokens){t.style.transform='translateY(0px)';t.style.opacity='1'}}
function setFinal(s){cancelAll(s);for(const t of s.tokens){t.style.transform=`translateY(${s.dy}px)`;t.style.opacity='1'}}
function pos(t,from,to,opts){return t.animate([{transform:`translateY(${from}px)`},{transform:`translateY(${to}px)`}],{...COMMON,...opts})}
function play(s){
 setStart(s); if(media.matches){setFinal(s);return}
 const v=VARIANTS[s.variant];
 if(v.family==='F1'){v.delays.forEach((delay,i)=>pos(s.tokens[i],0,s.dy,{duration:v.duration,delay,easing:EASING}))}
 else{
  const d=s.dy,k=[{transform:'translateY(0px)',offset:0,easing:'linear'},{transform:`translateY(${d*.15}px)`,offset:220/620,easing:'linear'},{transform:`translateY(${d*.78}px)`,offset:430/620,easing:'linear'},{transform:`translateY(${d}px)`,offset:1}];
  for(const t of s.tokens)t.animate(k,{...COMMON,duration:620,delay:0,easing:'linear'});
 }
}
function buildCanvas(variant,ctx,view){
 const cfg=VIEWS[view], s={id:`${variant}-${ctx}-${view}`,variant,ctx,view,dy:CONTEXTS[ctx].dy,tokens:[]};
 const canvas=document.createElement('div');canvas.className='scored-canvas';canvas.style.width=`${cfg.width}px`;canvas.style.height=`${cfg.height}px`;canvas.setAttribute('role','presentation');
 const left=startLeft(cfg.width);
 for(let i=0;i<4;i++){const t=document.createElement('div');t.className='token';t.textContent=String(i+1);t.style.left=`${left+i*52}px`;canvas.append(t);s.tokens.push(t)}
 s.canvas=canvas;mounted.set(s.id,s);return s
}
function mountReview(ctx='WEB',view='WIDE'){
 mounted.clear();const grid=document.getElementById('grid');grid.textContent='';
 for(const variant of ['F1A','F1B','F1C','F4']){
  const v=VARIANTS[variant],card=document.createElement('section');card.className='card';
  const h=document.createElement('h2');h.textContent=v.label;const meta=document.createElement('p');meta.className='meta';
  meta.textContent=v.family==='F1'?`${v.delays[1]-v.delays[0]} ms onset · ${v.duration} ms movement · ${v.last} ms total`:'620 ms frozen F4 reference';
  const b=document.createElement('button');b.type='button';b.textContent='Replay';const shell=document.createElement('div');shell.className='canvas-shell';
  const s=buildCanvas(variant,ctx,view);shell.append(s.canvas);b.addEventListener('click',()=>play(s));card.append(h,meta,b,shell);grid.append(card);s.button=b;s.shell=shell;
 }
}
let currentCtx='WEB',currentView='WIDE';
function select(kind,value){if(kind==='ctx')currentCtx=value;else currentView=value;for(const b of document.querySelectorAll(`.${kind}`))b.setAttribute('aria-pressed',String(b.dataset.value===value));mountReview(currentCtx,currentView)}
for(const b of document.querySelectorAll('.ctx'))b.addEventListener('click',()=>select('ctx',b.dataset.value));
for(const b of document.querySelectorAll('.view'))b.addEventListener('click',()=>select('view',b.dataset.value));
document.getElementById('replay-all').addEventListener('click',()=>{for(const s of mounted.values())play(s)});
media.addEventListener('change',e=>{if(e.matches)for(const s of mounted.values())setFinal(s)});
function m42(el){const tr=getComputedStyle(el).transform;return tr==='none'?0:new DOMMatrixReadOnly(tr).m42}
function effectDump(t){return t.getAnimations().map(a=>{const z=a.effect.getTiming();return{timing:{delay:z.delay,duration:z.duration,easing:z.easing,fill:z.fill,iterations:z.iterations},keyframes:a.effect.getKeyframes().map(k=>({offset:k.offset,easing:k.easing,transform:k.transform??null}))}})}
async function diagnostic(){
 document.getElementById('review-ui').hidden=true;mounted.clear();
 const host=document.createElement('main');document.body.append(host);const specimens=[];
 for(const variant of Object.keys(VARIANTS))for(const ctx of Object.keys(CONTEXTS))for(const view of Object.keys(VIEWS)){
  const s=buildCanvas(variant,ctx,view),wrap=document.createElement('section'),b=document.createElement('button');b.type='button';b.textContent='Replay';wrap.append(b,s.canvas);host.append(wrap);s.button=b;
  const initialAnimations=s.canvas.getAnimations({subtree:true}).length;b.focus();const focusBefore=document.activeElement===b;play(s);const focusAfter=document.activeElement===b;
  const effects=s.tokens.map(effectDump),animationsAfter=s.canvas.getAnimations({subtree:true}).length;
  specimens.push({id:s.id,variant,context:ctx,viewport:view,width:s.canvas.clientWidth,height:s.canvas.clientHeight,scrollWidth:s.canvas.scrollWidth,initialAnimations,focusBefore,focusAfter,animationsAfter,
    geometry:s.tokens.map(t=>({left:t.offsetLeft,top:t.offsetTop,width:t.offsetWidth,height:t.offsetHeight})),effects});
 }
 for(const s of mounted.values())for(const t of s.tokens)for(const a of t.getAnimations()){const z=a.effect.getTiming();a.currentTime=Number(z.delay)+Number(z.duration)}
 const by=Object.fromEntries(specimens.map(x=>[x.id,x]));
 for(const s of mounted.values()){const r=by[s.id];r.final=s.tokens.map(t=>({translateY:m42(t),opacity:Number(getComputedStyle(t).opacity),animations:t.getAnimations().length,playStates:t.getAnimations().map(a=>a.playState)}))}
 const report={schema:'kymaean.mot01.f1-refinement-browser-diagnostic.v1',reduced:media.matches,userAgent:navigator.userAgent,platform:navigator.platform,devicePixelRatio,specimens};
 const pre=document.getElementById('diagnostic-report');pre.hidden=false;pre.textContent=JSON.stringify(report)
}
const q=new URLSearchParams(location.search);if(q.get('diagnostic')==='1')diagnostic();else mountReview();
</script></body></html>
