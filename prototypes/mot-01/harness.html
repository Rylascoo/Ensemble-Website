<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MOT-01 deterministic temporal specimen harness</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#fff;color:#111;font-family:system-ui,sans-serif}body{padding:16px}.specimen{margin:0 0 28px 0;width:min-content;max-width:100%}.chrome{font:400 14px/1.4 system-ui,sans-serif;color:#111;background:#fff;margin:0 0 8px 0;max-width:100%;overflow-wrap:anywhere}.chrome-line{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.chrome button{font:400 14px/1.2 system-ui,sans-serif;transform:none;animation:none;transition:none}.scored-canvas{position:relative;padding:0;margin:0;background:#fff;overflow:visible;border:0;box-shadow:none}.token{position:absolute;top:72px;width:36px;height:36px;background:#e6e6e6;color:#111;font:600 14px/36px system-ui,sans-serif;text-align:center;border:0;box-shadow:none;transform-origin:center center;transform:translateY(0px);opacity:1}#diagnostic-report{white-space:pre-wrap;font:12px/1.3 monospace}
</style></head><body><main id="root"></main><pre id="diagnostic-report" hidden></pre>
<script>'use strict';
const CONFIGS={
'M01-01':{context:'APP',viewport:'REFLOW_320',width:320,height:240,dy:28,code:'h'},'M01-02':{context:'WEB',viewport:'WIDE',width:640,height:240,dy:56,code:'p'},'M01-03':{context:'WEB',viewport:'REFLOW_320',width:320,height:240,dy:56,code:'d'},'M01-04':{context:'WEB',viewport:'REFLOW_320',width:320,height:240,dy:56,code:'s'},'M01-05':{context:'WEB',viewport:'WIDE',width:640,height:240,dy:56,code:'h'},'M01-06':{context:'WEB',viewport:'WIDE',width:640,height:240,dy:56,code:'v'},'M01-07':{context:'WEB',viewport:'REFLOW_320',width:320,height:240,dy:56,code:'v'},'M01-08':{context:'APP',viewport:'WIDE',width:640,height:240,dy:28,code:'p'},'M01-09':{context:'WEB',viewport:'WIDE',width:640,height:240,dy:56,code:'d'},'M01-10':{context:'APP',viewport:'WIDE',width:640,height:240,dy:28,code:'v'},'M01-11':{context:'APP',viewport:'REFLOW_320',width:320,height:240,dy:28,code:'o'},'M01-12':{context:'APP',viewport:'REFLOW_320',width:320,height:240,dy:28,code:'v'},'M01-13':{context:'APP',viewport:'WIDE',width:640,height:240,dy:28,code:'d'},'M01-14':{context:'APP',viewport:'REFLOW_320',width:320,height:240,dy:28,code:'p'},'M01-15':{context:'APP',viewport:'WIDE',width:640,height:240,dy:28,code:'o'},'M01-16':{context:'APP',viewport:'WIDE',width:640,height:240,dy:28,code:'h'},'M01-17':{context:'APP',viewport:'WIDE',width:640,height:240,dy:28,code:'s'},'M01-18':{context:'APP',viewport:'REFLOW_320',width:320,height:240,dy:28,code:'d'},'M01-19':{context:'WEB',viewport:'REFLOW_320',width:320,height:240,dy:56,code:'h'},'M01-20':{context:'WEB',viewport:'REFLOW_320',width:320,height:240,dy:56,code:'p'},'M01-21':{context:'WEB',viewport:'WIDE',width:640,height:240,dy:56,code:'o'},'M01-22':{context:'WEB',viewport:'REFLOW_320',width:320,height:240,dy:56,code:'o'},'M01-23':{context:'WEB',viewport:'WIDE',width:640,height:240,dy:56,code:'s'},'M01-24':{context:'APP',viewport:'REFLOW_320',width:320,height:240,dy:28,code:'s'}};
const IDS=Object.keys(CONFIGS).sort(),media=matchMedia('(prefers-reduced-motion: reduce)'),mounted=new Map(),easing='cubic-bezier(0.2,0,0,1)',COMMON={iterations:1,direction:'normal',fill:'forwards',composite:'replace',iterationComposite:'replace'};
function px(n){return `${Number(n.toFixed(8))}px`}function startLeft(w){return (w-192)/2}
function setStart(s){for(const t of s.tokens){for(const a of t.getAnimations())a.cancel();t.style.transform='translateY(0px)';t.style.opacity='1';}}
function setFinal(s){for(const t of s.tokens){for(const a of t.getAnimations())a.cancel();t.style.transform=`translateY(${s.cfg.dy}px)`;t.style.opacity='1';}}
function posAnim(t,from,to,opts){return t.animate([{transform:`translateY(${from}px)`},{transform:`translateY(${to}px)`}],{...COMMON,...opts});}
function play(s){setStart(s);if(media.matches){setFinal(s);return;}const d=s.cfg.dy,c=s.cfg.code;if(c==='s'){for(const t of s.tokens)posAnim(t,0,d,{duration:260,delay:0,easing});}else if(c==='p'){for(const t of s.tokens){posAnim(t,0,d,{duration:720,delay:0,easing});t.animate([{opacity:1,offset:0,easing:'linear'},{opacity:.35,offset:.5,easing:'linear'},{opacity:1,offset:1}],{...COMMON,duration:720,delay:0,easing:'linear'});}}else if(c==='o'){[0,90,180,270].forEach((delay,i)=>posAnim(s.tokens[i],0,d,{duration:520,delay,easing}));}else if(c==='h'){const k=[{transform:'translateY(0px)',offset:0,easing},{transform:`translateY(${px(d*.42)})`,offset:220/680,easing:'linear'},{transform:`translateY(${px(d*.42)})`,offset:340/680,easing},{transform:`translateY(${d}px)`,offset:1}];for(const t of s.tokens)t.animate(k,{...COMMON,duration:680,delay:0,easing:'linear'});}else if(c==='d'){[720,440,440,720].forEach((duration,i)=>posAnim(s.tokens[i],0,d,{duration,delay:0,easing}));}else if(c==='v'){const k=[{transform:'translateY(0px)',offset:0,easing:'linear'},{transform:`translateY(${px(d*.15)})`,offset:220/620,easing:'linear'},{transform:`translateY(${px(d*.78)})`,offset:430/620,easing:'linear'},{transform:`translateY(${d}px)`,offset:1}];for(const t of s.tokens)t.animate(k,{...COMMON,duration:620,delay:0,easing:'linear'});}}
function mount(id){const cfg=CONFIGS[id],wrap=document.createElement('section');wrap.className='specimen';wrap.dataset.anonId=id;const chrome=document.createElement('div');chrome.className='chrome';chrome.style.width=`${cfg.width}px`;const line=document.createElement('div');line.className='chrome-line';const meta=document.createElement('span');meta.textContent=`${id} · ${cfg.context} · ${cfg.viewport}`;const b=document.createElement('button');b.type='button';b.textContent='Replay transition';line.append(meta,b);chrome.append(line);const canvas=document.createElement('div');canvas.className='scored-canvas';canvas.setAttribute('role','presentation');canvas.style.width=`${cfg.width}px`;canvas.style.height=`${cfg.height}px`;const tokens=[],left=startLeft(cfg.width);for(let i=0;i<4;i++){const t=document.createElement('div');t.className='token';t.textContent=String(i+1);t.style.left=`${left+i*52}px`;canvas.append(t);tokens.push(t);}wrap.append(chrome,canvas);document.getElementById('root').append(wrap);const s={id,cfg,wrap,chrome,button:b,canvas,tokens};mounted.set(id,s);b.addEventListener('click',()=>play(s));return s;}
media.addEventListener('change',e=>{if(e.matches)for(const s of mounted.values())setFinal(s);});
function m42(el){const tr=getComputedStyle(el).transform;return tr==='none'?0:new DOMMatrixReadOnly(tr).m42}
function inspectEffects(s){return s.tokens.map(t=>t.getAnimations().map(a=>({playState:a.playState,timing:(()=>{const z=a.effect.getTiming();return{delay:z.delay,duration:z.duration,easing:z.easing,fill:z.fill,iterations:z.iterations}})(),keyframes:a.effect.getKeyframes().map(k=>({offset:k.offset,easing:k.easing,transform:k.transform??null,opacity:k.opacity??null}))})));}
async function diagnostic(){const report={schema:'kymaean.mot01.browser-preflight.v1',reduced:media.matches,userAgent:navigator.userAgent,platform:navigator.platform,devicePixelRatio,innerWidth,innerHeight,specimens:[]};for(const id of IDS){const s=mounted.get(id),cfg=s.cfg,expectedLeft=[0,1,2,3].map(i=>startLeft(cfg.width)+i*52),initialAnimations=s.canvas.getAnimations({subtree:true}).length,geometry=s.tokens.map((t,i)=>({left:t.offsetLeft,top:t.offsetTop,width:t.offsetWidth,height:t.offsetHeight,expectedLeft:expectedLeft[i]})),styles=s.tokens.map(t=>{const z=getComputedStyle(t);return{fontFamily:z.fontFamily,fontSize:z.fontSize,fontWeight:z.fontWeight,color:z.color,background:z.backgroundColor,transform:z.transform,opacity:Number(z.opacity)}});s.button.focus();const focusBefore=document.activeElement===s.button;play(s);const focusAfter=document.activeElement===s.button,animationsAfter=s.canvas.getAnimations({subtree:true}).length,effects=inspectEffects(s);report.specimens.push({id,context:cfg.context,viewport:cfg.viewport,width:s.canvas.clientWidth,height:s.canvas.clientHeight,scrollWidth:s.canvas.scrollWidth,chromeWidth:s.chrome.clientWidth,chromeScrollWidth:s.chrome.scrollWidth,initialAnimations,geometry,styles,focusBefore,focusAfter,animationsAfter,effects});}for(const s of mounted.values()){for(const t of s.tokens){for(const a of t.getAnimations()){const z=a.effect.getTiming();a.currentTime=Number(z.delay)+Number(z.duration);}}}for(const r of report.specimens){const s=mounted.get(r.id);r.final=s.tokens.map(t=>({translateY:m42(t),opacity:Number(getComputedStyle(t).opacity),animations:t.getAnimations().length,progress:t.getAnimations().map(a=>a.effect.getComputedTiming().progress)}));}document.getElementById('diagnostic-report').hidden=false;document.getElementById('diagnostic-report').textContent=JSON.stringify(report);}
const q=new URLSearchParams(location.search),diag=q.get('diagnostic')==='1';if(diag){for(const id of IDS)mount(id);diagnostic();}else{const id=q.get('anon')&&CONFIGS[q.get('anon')]?q.get('anon'):IDS[0];mount(id);}
</script></body></html>
