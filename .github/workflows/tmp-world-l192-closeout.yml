name: Temporary WORLD L192 Closeout

on:
  push:
    branches:
      - site/v2-2-world-minimal-evidence-closeout-2026-09-16
    paths:
      - .github/workflows/tmp-world-l192-closeout.yml

permissions:
  contents: write

jobs:
  append-ledger:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: site/v2-2-world-minimal-evidence-closeout-2026-09-16
      - name: Append L-192 exactly once
        env:
          LEDGER_ENTRY_B64: " Pbk hFcEZZRWNEWlBYamd3aUFjX1Z1VGpzUW "
        run: |
          if ! grep -q '^## L-192 ' docs/evidence/DESIGN_LEDGER.md; then
            printf '%s' "$LEDGER_ENTRY_B64" | base64 -d >> docs/evidence/DESIGN_LEDGER.md
          fi
      - name: Validate repository guards
        run: |
          python tools/validate_document_status.py
          python tools/validate_repository_boundaries.py
          python tools/generate_docs_index.py --check
      - name: Commit ledger append
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add docs/evidence/DESIGN_LEDGER.md
            git commit -m 'Website: record WORLD minimal-evidence concept result'
            git push
          fi
