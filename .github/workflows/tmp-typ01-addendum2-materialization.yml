name: Temporary TYP-01 provenance and failure audit

on:
  push:
    branches:
      - tmp/typ01-harness-materialization

permissions:
  contents: read

jobs:
  audit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Audit frozen contracts and preflight failures
        shell: bash
        run: |
          cat .tmp/typ01-bundle.part-* > /tmp/typ01-bundle.b64
          test "$(wc -c < /tmp/typ01-bundle.b64)" -eq 16804
          test "$(sha256sum /tmp/typ01-bundle.b64 | awk '{print $1}')" = "a72eeecd655d1590fda320d9ccaddf3c9ffc38e2052538f82e6b99c6b7f93e5f"
          base64 -d /tmp/typ01-bundle.b64 > /tmp/typ01-bundle.tar.gz
          gzip -t /tmp/typ01-bundle.tar.gz
          echo 'TYP01_BUNDLE_MEMBERS_BEGIN'
          tar -tzf /tmp/typ01-bundle.tar.gz | sort
          echo 'TYP01_BUNDLE_MEMBERS_END'
          python - <<'PY'
          import json
          from pathlib import Path
          method=json.loads(Path('docs/evidence/TYP_01_TYPOGRAPHIC_EDITORIAL_IDENTITY_INDEPENDENCE_METHOD_AND_MATRIX_01.json').read_text())
          add1=json.loads(Path('docs/evidence/TYP_01_EXECUTION_DEFAULTS_ADDENDUM_01.json').read_text())
          add2=json.loads(Path('docs/evidence/TYP_01_EXECUTION_DEFAULTS_ADDENDUM_02.json').read_text())
          print('TYP01_METHOD_TOP_KEYS='+','.join(method.keys()))
          for k,v in method.items():
              lk=k.lower()
              if any(term in lk for term in ('context','control','famil','adapt','vector','preflight','hard_failure','termination')):
                  print('TYP01_METHOD_SECTION='+k+' '+json.dumps(v,separators=(',',':'),ensure_ascii=False))
          print('TYP01_ADDENDUM01_PREFLIGHT='+json.dumps(add1['preflight_interpretation'],separators=(',',':')))
          print('TYP01_ADDENDUM02_RESIDUAL='+json.dumps(add2['residual_defaults'],separators=(',',':')))
          raw=Path('prototypes/typ-01/freeze-diagnostic.txt').read_text(encoding='utf-8')
          report,end=json.JSONDecoder().raw_decode(raw)
          failures=[]
          for s in report['specimens']:
              if not s.get('pass'):
                  reasons=[]
                  for mode in ('normal','resize200','text_spacing_stress'):
                      g=s[mode]
                      bad=[k for k in ('horizontal_overflow','clipping','overlap') if g.get(k)]
                      if bad:
                          reasons.append(f"{mode}:{','.join(bad)}:client={g['width']['client']}:scroll={g['width']['scroll']}")
                  failures.append((s['specimen_id'], reasons))
          print(f"TYP01_OVERALL_PASS={report['overall_pass']}")
          print(f"TYP01_FAILURE_COUNT={len(failures)}")
          for specimen_id,reasons in failures:
              print('TYP01_FAIL='+specimen_id+' | '+' | '.join(reasons))
          PY
