name: Temporary MOT-01 context-shift ledger append

on:
  push:
    branches:
      - tmp/mot01-context-shift-ledger

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: true
      - name: Append L-047 and L-048
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "import base64,pathlib; p=pathlib.Path('docs/evidence/DESIGN_LEDGER.md'); t=p.read_text(); a='## L-047 — F1A deployment envelope is approved and context-shift differentiation is required'; b='## L-048 — Context-shift differentiation contract is frozen'; assert ((a in t)==(b in t)), 'partial ledger append detected'; s=base64.b64decode('').decode(); p.write_text(t if a in t else t+s)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/evidence/DESIGN_LEDGER.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Append MOT-01 context-shift ledger closures'
          git push origin HEAD:tmp/mot01-context-shift-ledger
