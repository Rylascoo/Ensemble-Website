name: Stage 6M tooling

on:
  push:
    paths:
      - 'tools/stage6m_maquette.py'
      - 'tools/stage6m_maquette_core.py'
      - 'tools/stage6m_maquette_core_source.part*'
      - 'tools/stage6m_maquette_hardening.py'
      - 'tools/stage6m_maquette_union_renderer.py'
      - 'tools/test_stage6m_maquette.py'
      - 'tools/test_stage6m_core_bypass.py'
      - 'docs/evidence/stage6m/**'
      - '.github/workflows/stage6m-tooling.yml'
  pull_request:
    paths:
      - 'tools/stage6m_maquette.py'
      - 'tools/stage6m_maquette_core.py'
      - 'tools/stage6m_maquette_core_source.part*'
      - 'tools/stage6m_maquette_hardening.py'
      - 'tools/stage6m_maquette_union_renderer.py'
      - 'tools/test_stage6m_maquette.py'
      - 'tools/test_stage6m_core_bypass.py'
      - 'docs/evidence/stage6m/**'
      - '.github/workflows/stage6m-tooling.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run Stage 6M unit tests
        run: python3 tools/test_stage6m_maquette.py
      - name: Verify internal core cannot bypass hardening or physical-union rendering
        run: python3 tools/test_stage6m_core_bypass.py
      - name: Verify deterministic non-candidate fixture bytes
        run: >-
          python3 tools/stage6m_maquette.py validate
          docs/evidence/stage6m/NONCANDIDATE_FIXTURE_01.json
          --expected-svg docs/evidence/stage6m/NONCANDIDATE_FIXTURE_01_SANITIZED.svg
          --expected-report docs/evidence/stage6m/NONCANDIDATE_FIXTURE_01_REPORT.json
      - name: Verify Candidate 07 deterministic Stage 6M bytes and statics
        run: |
          python3 - <<'PY'
          import hashlib, json, pathlib, sys
          sys.path.insert(0, 'tools')
          from stage6m_maquette import deterministic_bytes

          path = pathlib.Path('docs/evidence/stage6m/C07-CBSR-01_STAGE6M_MANIFEST.json')
          manifest = json.loads(path.read_text(encoding='utf-8'))
          svg, report_text = deterministic_bytes(manifest)
          svg_sha = hashlib.sha256(svg.encode('utf-8')).hexdigest()
          report_sha = hashlib.sha256(report_text.encode('utf-8')).hexdigest()
          assert svg_sha == '1a3cf18f5270cbf25209a76f2fb00e3de0e57aa9c7c565ec769a505b2580e89d', svg_sha
          assert report_sha == '82b050dacc50fdb06dfa56ff66ce2b204b77259211d0453c2d65fb49f2c5badc', report_sha
          report = json.loads(report_text)
          assert report['automated_validation_pass'] is True
          assert report['transfer_eligible'] is True
          cases = {case['id']: case for case in report['static_cases']}
          assert cases['A-unsupported']['computed_margin_source_px'] >= 79.9
          assert -cases['B-unsupported']['computed_margin_source_px'] >= 16.0
          assert cases['B-supported-by-A']['proxy_margin_source_px'] >= 9.98
          assert cases['B-supported-by-A']['counterparty_margin_source_px'] >= 65.3
          print('C07 SVG SHA256', svg_sha)
          print('C07 report SHA256', report_sha)
          PY
