name: Temporary CMP-01 browser preflight

on:
  push:
    branches:
      - design/phase-b-reentry-post-mat01-2026-09-10
    paths:
      - .github/workflows/tmp-cmp01-browser-preflight.yml
      - prototypes/cmp-01/harness.html
      - tools/verify_cmp01.py
      - tools/cmp01_browser_probe.mjs
      - tools/verify_cmp01_browser.py
      - docs/evidence/CMP_01_FROZEN_SOURCE_MANIFEST_03.json

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Static source checks
        run: python tools/verify_cmp01.py
      - name: Hosted Chrome eight-mode checks
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          export BROWSER
          BROWSER_VERSION="$($BROWSER --version)"
          OS_PRETTY="$(. /etc/os-release; printf '%s' "$PRETTY_NAME")"
          mkdir -p /tmp/cmp01-artifact/diagnostics /tmp/cmp01-artifact/screenshots
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/cmp01-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8765/prototypes/cmp-01/harness.html >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:8765/prototypes/cmp-01/harness.html >/dev/null
          run_cdp() {
            local forced="$1" reduced="$2" width="$3" stem="$4"
            node --experimental-websocket tools/cmp01_browser_probe.mjs "$forced" "$reduced" "$width" \
              "/tmp/cmp01-artifact/diagnostics/$stem.json" "/tmp/cmp01-$stem" "/tmp/cmp01-artifact/screenshots/$stem.png"
          }
          run_cdp normal full 1200 normal-full-wide
          run_cdp normal full 320 normal-full-320
          run_cdp normal reduced 1200 normal-reduced-wide
          run_cdp normal reduced 320 normal-reduced-320
          run_cdp forced full 1200 forced-full-wide
          run_cdp forced full 320 forced-full-320
          run_cdp forced reduced 1200 forced-reduced-wide
          run_cdp forced reduced 320 forced-reduced-320
          python tools/verify_cmp01_browser.py \
            --normal-full-wide /tmp/cmp01-artifact/diagnostics/normal-full-wide.json \
            --normal-full-320 /tmp/cmp01-artifact/diagnostics/normal-full-320.json \
            --normal-reduced-wide /tmp/cmp01-artifact/diagnostics/normal-reduced-wide.json \
            --normal-reduced-320 /tmp/cmp01-artifact/diagnostics/normal-reduced-320.json \
            --forced-full-wide /tmp/cmp01-artifact/diagnostics/forced-full-wide.json \
            --forced-full-320 /tmp/cmp01-artifact/diagnostics/forced-full-320.json \
            --forced-reduced-wide /tmp/cmp01-artifact/diagnostics/forced-reduced-wide.json \
            --forced-reduced-320 /tmp/cmp01-artifact/diagnostics/forced-reduced-320.json \
            --browser-version "$BROWSER_VERSION" --os-pretty "$OS_PRETTY" \
            --output /tmp/cmp01-artifact/CMP_01_BROWSER_PREFLIGHT_01.json
          cp prototypes/cmp-01/harness.html /tmp/cmp01-artifact/harness.html
          cp docs/evidence/CMP_01_FROZEN_SOURCE_MANIFEST_03.json /tmp/cmp01-artifact/manifest-03.json
          cp docs/evidence/CMP_01_BOUNDED_PACKET_COMPOSITION_METHOD_AND_MATRIX_01.json /tmp/cmp01-artifact/method.json
          cp docs/evidence/CMP_01_EXECUTION_DEFAULTS_01.json /tmp/cmp01-artifact/defaults.json
          printf '%s\n' "$BROWSER_VERSION" > /tmp/cmp01-artifact/browser-version.txt
          printf '%s\n' "$OS_PRETTY" > /tmp/cmp01-artifact/os-pretty.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: cmp01-preflight
          path: /tmp/cmp01-artifact
          if-no-files-found: error
          retention-days: 7
