name: Repository publication boundaries

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify publication, continuity and residency boundaries
        run: python3 tools/validate_repository_boundaries.py
      - name: Verify Q-ADMIN-05 recursive source closure
        run: python3 tools/validate_qadmin05_recursive_closure.py --self-test
      - name: Verify Q-ADMIN-05 Website authority transition
        run: python3 tools/validate_qadmin05_transition.py
