name: Temporary STA-01 browser preflight

on:
  push:
    branches:
      - design/sta01-noncolor-state-treatment-2026-09-10

permissions:
  contents: read

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Static frozen-contract checks
        run: python tools/verify_sta01.py
      - name: Hosted Chrome state, reflow, focus and forced-colors checks
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          export BROWSER
          BROWSER_VERSION="$($BROWSER --version)"
          OS_PRETTY="$(. /etc/os-release; printf '%s' "$PRETTY_NAME")"
          mkdir -p /tmp/sta01-artifact/diagnostics /tmp/sta01-artifact/screens
          cat > /tmp/sta01-cdp.mjs <<'NODE'
          import { spawn } from 'node:child_process';
          import fs from 'node:fs';
          const [mode,widthArg,diagPath,shotPath,profile] = process.argv.slice(2);
          const width = Number(widthArg), height = 2600, browser = process.env.BROWSER;
          fs.rmSync(profile,{recursive:true,force:true});
          fs.mkdirSync(profile,{recursive:true});
          const args=['--headless=new','--no-sandbox','--disable-gpu','--allow-file-access-from-files','--remote-debugging-port=0',`--user-data-dir=${profile}`,'about:blank'];
          if(mode==='forced') args.splice(args.length-1,0,'--force-high-contrast');
          const cp=spawn(browser,args,{stdio:['ignore','ignore','inherit']});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function endpoint(){
            const active=profile+'/DevToolsActivePort';
            for(let i=0;i<120;i++){
              if(fs.existsSync(active)){
                const [port]=fs.readFileSync(active,'utf8').trim().split(/\r?\n/);
                try{ const a=await (await fetch(`http://127.0.0.1:${port}/json/list`)).json(); if(a[0]?.webSocketDebuggerUrl) return a[0].webSocketDebuggerUrl; }catch{}
              }
              if(cp.exitCode!==null) throw new Error('Chrome exited before DevTools endpoint became available: '+cp.exitCode);
              await sleep(100);
            }
            throw new Error('CDP endpoint unavailable');
          }
          try{
            const ws=new WebSocket(await endpoint());
            await new Promise((res,rej)=>{ws.onopen=res; ws.onerror=rej});
            let id=0; const pending=new Map();
            ws.onmessage=e=>{const m=JSON.parse(e.data); if(m.id&&pending.has(m.id)){const {res,rej}=pending.get(m.id); pending.delete(m.id); m.error?rej(new Error(JSON.stringify(m.error))):res(m.result)}};
            const send=(method,params={})=>new Promise((res,rej)=>{const n=++id; pending.set(n,{res,rej}); ws.send(JSON.stringify({id:n,method,params}))});
            await send('Page.enable'); await send('Runtime.enable');
            await send('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:1,mobile:false,screenWidth:width,screenHeight:height});
            const url='file://'+process.cwd()+'/prototypes/sta-01/harness.html?diagnostic=1';
            await send('Page.navigate',{url}); await sleep(900);
            const ev=await send('Runtime.evaluate',{expression:"document.getElementById('sta-diagnostic').textContent",returnByValue:true});
            if(!ev?.result?.value) throw new Error('STA diagnostic not produced');
            fs.writeFileSync(diagPath,ev.result.value+'\n');
            const layout=await send('Page.getLayoutMetrics');
            const size=layout.cssContentSize;
            const shot=await send('Page.captureScreenshot',{format:'png',captureBeyondViewport:true,clip:{x:0,y:0,width:size.width,height:size.height,scale:1}});
            fs.writeFileSync(shotPath,Buffer.from(shot.data,'base64'));
            ws.close();
          } finally {
            cp.kill('SIGTERM');
            await Promise.race([new Promise(r=>cp.once('exit',r)),sleep(1500)]);
          }
          NODE
          run_cdp() {
            local mode="$1" width="$2" stem="$3"
            node --experimental-websocket /tmp/sta01-cdp.mjs "$mode" "$width" "/tmp/sta01-artifact/diagnostics/$stem.json" "/tmp/sta01-artifact/screens/$stem.png" "/tmp/sta01-$stem"
          }
          run_cdp normal 1200 normal-wide
          run_cdp forced 1200 forced-wide
          run_cdp normal 320 normal-320
          run_cdp forced 320 forced-320
          python tools/verify_sta01.py \
            --normal-wide /tmp/sta01-artifact/diagnostics/normal-wide.json \
            --forced-wide /tmp/sta01-artifact/diagnostics/forced-wide.json \
            --normal-320 /tmp/sta01-artifact/diagnostics/normal-320.json \
            --forced-320 /tmp/sta01-artifact/diagnostics/forced-320.json \
            --browser-version "$BROWSER_VERSION" --os-pretty "$OS_PRETTY" \
            --output /tmp/sta01-artifact/STA_01_STRUCTURAL_ACCESSIBILITY_PREFLIGHT_01.json
          cp prototypes/sta-01/harness.html /tmp/sta01-artifact/harness.html
          cp docs/evidence/STA_01_NONCOLOR_FOCUS_SELECTION_METHOD_AND_MATRIX_01.json /tmp/sta01-artifact/method.json
          printf '%s\n' "$BROWSER_VERSION" > /tmp/sta01-artifact/browser-version.txt
          printf '%s\n' "$OS_PRETTY" > /tmp/sta01-artifact/os-pretty.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sta01-preflight
          path: /tmp/sta01-artifact
          if-no-files-found: error
          retention-days: 7
