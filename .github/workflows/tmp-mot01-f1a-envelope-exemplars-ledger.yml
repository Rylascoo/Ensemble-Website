name: Temporary MOT-01 F1A exemplar ledger checkpoint

on:
  push:
    branches:
      - tmp/mot01-f1a-envelope-exemplars-ledger

permissions:
  contents: write

jobs:
  checkpoint:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Append Q-DESIGN-14 preflight checkpoint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/evidence/DESIGN_LEDGER.md')
          text=p.read_text()
          marker='## L-046 — F1A deployment-envelope exemplars pass preflight and enter Director review'
          if marker in text:
              raise SystemExit('L-046 already exists')
          entry='''\n\n## L-046 — F1A deployment-envelope exemplars pass preflight and enter Director review\n\n**State:** Q-DESIGN-14 ACTIVE / EXEMPLAR PREFLIGHT CLEAN / DIRECTOR ADJUDICATION READY / NO PRODUCTION MOTION AUTHORITY\n\nThe frozen Q-DESIGN-13 use envelope has been materialized into five labeled, non-production Q-DESIGN-14 exemplars under `prototypes/mot-01/deployment-envelope/`: three eligible candidates (A1 peer constellation, A2 explicit explanatory order, A3 pre-existing grouped 5+ content) and two intentional negative controls (N1 six-row direct cascade, N2 fake process sequence). F1A cadence was not retuned: every animated unit uses the Director-selected 70 ms onset interval and 460 ms equal movement with the unchanged easing; research displacement remains 28px APP / 56px WEB.\n\nHosted Chrome 152.0.7977.82 preflight run `34383807334` passed **20/20 FULL + 20/20 REDUCED** across APP/WEB and WIDE/320. It verified exact motion declarations, no autoplay, focus preservation, final displacement/opacity, zero horizontal overflow, classification integrity, and zero created animations under forced reduced motion. The frozen evidence is `docs/evidence/MOT_01_F1A_DEPLOYMENT_ENVELOPE_EXEMPLAR_PREFLIGHT_01.json`; exemplar SHA-256 is `bc4edf262bbf48f7cd949f31d8c20a5de4732ef6e76384f35f11f76eca03a0af`.\n\nA prior hosted attempt `34383596359` is infrastructure-invalid only: an apt repository Hash Sum mismatch occurred while installing Playwright browser dependencies before the exemplar step. It created no artifact result. The valid rerun used the Chrome already present in the runner image.\n\nDesign Sol's preliminary visual read is preserved as input, not Director judgment: A1 is the clearest pure identity use; A2 is semantically safe but dense at 320; A3 validates grouped batching; N1 reads as generic/overextended list choreography; N2 reads as false process semantics.\n\n**Next gate:** direct labeled Design Sol + Director adjudication of whether this three-allowed/two-prohibited set makes the F1A use envelope intuitive and appropriately restrictive. Cadence is not reopened by this gate.\n\n**Guardrail:** no production timing/displacement token, app/site implementation, arbitrary list/feed generalization, Stage motion, final identity or Phase-C convergence. Q-DESIGN-14 is not closed until Director adjudication is durably recorded.\n'''
          p.write_text(text.rstrip()+entry+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/tmp-mot01-f1a-envelope-exemplars-ledger.yml
          git add docs/evidence/DESIGN_LEDGER.md
          git commit -m 'Checkpoint F1A exemplar preflight'
          git push origin HEAD:tmp/mot01-f1a-envelope-exemplars-ledger
