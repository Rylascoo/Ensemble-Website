name: Document status structure

on:
  push:
    paths:
      - '**/*.md'
      - 'tools/generate_docs_index.py'
      - 'tools/validate_document_status.py'
      - '.github/workflows/document-status.yml'
  pull_request:
    paths:
      - '**/*.md'
      - 'tools/generate_docs_index.py'
      - 'tools/validate_document_status.py'
      - '.github/workflows/document-status.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Validate document structure
        run: python3 tools/validate_document_status.py
