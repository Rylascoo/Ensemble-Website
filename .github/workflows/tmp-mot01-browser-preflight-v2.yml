name: Temporary MOT-01 browser preflight v2

on:
  push:
    branches:
      - tmp/mot01-preflight-v2

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Correct diagnostic checkpointing, freeze source, and preflight
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          p=Path('prototypes/mot-01/harness.html')
          s=p.read_text()
          old="await new Promise(r=>setTimeout(r,1000));for(const r of report.specimens){const s=mounted.get(r.id);r.final=s.tokens.map(t=>({translateY:m42(t),opacity:Number(getComputedStyle(t).opacity),animations:t.getAnimations().length,playStates:t.getAnimations().map(a=>a.playState)}));}"
          new="for(const s of mounted.values()){for(const t of s.tokens){for(const a of t.getAnimations()){const z=a.effect.getTiming();a.currentTime=Number(z.delay)+Number(z.duration);}}}for(const r of report.specimens){const s=mounted.get(r.id);r.final=s.tokens.map(t=>({translateY:m42(t),opacity:Number(getComputedStyle(t).opacity),animations:t.getAnimations().length,progress:t.getAnimations().map(a=>a.effect.getComputedTiming().progress)}));}"
          if old not in s: raise SystemExit('expected wall-clock diagnostic block not found')
          p.write_text(s.replace(old,new,1))
          print('MOT01_DIAGNOSTIC_CORRECTION=DETERMINISTIC_CURRENT_TIME_CHECKPOINTS')
          PY

          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          export BROWSER_VERSION="$($BROWSER --version)"
          export OS_PRETTY="$(. /etc/os-release; printf '%s' "$PRETTY_NAME")"

          cat > /tmp/mot01-env-probe.html <<'EOF'
          <!doctype html><html><body><span id="p" style="font-family:system-ui,sans-serif">probe</span><pre id="environment"></pre><script>document.getElementById('environment').textContent=JSON.stringify({userAgent:navigator.userAgent,platform:navigator.platform,devicePixelRatio,computedFontFamily:getComputedStyle(document.getElementById('p')).fontFamily,innerWidth,innerHeight});</script></body></html>
          EOF
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --user-data-dir=/tmp/mot01-v2-env --dump-dom "file:///tmp/mot01-env-probe.html" > /tmp/mot01-v2-env.html 2>/tmp/mot01-v2-env.log

          python - <<'PY'
          import hashlib, html.parser, json, os
          from pathlib import Path
          class Grab(html.parser.HTMLParser):
              def __init__(self): super().__init__(); self.on=False; self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='pre' and dict(attrs).get('id')=='environment': self.on=True
              def handle_endtag(self,tag):
                  if tag=='pre' and self.on:self.on=False
              def handle_data(self,data):
                  if self.on:self.parts.append(data)
          g=Grab();g.feed(Path('/tmp/mot01-v2-env.html').read_text(errors='replace'))
          env=json.loads(''.join(g.parts));env['browser_version']=os.environ['BROWSER_VERSION'];env['os_pretty']=os.environ['OS_PRETTY']
          root=Path('prototypes/mot-01');sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest()
          m=json.loads((root/'manifest.json').read_text());m['status']='ENVIRONMENT_AND_SOURCE_FROZEN_BEFORE_TEMPORAL_PREFLIGHT';m['environment']=env;m['source_sha256']={'harness.html':sha(root/'harness.html'),'reviewer.html':sha(root/'reviewer.html'),'blinding-key.json':sha(root/'blinding-key.json')};m['reviewer_exposure']=False;m['scoring_performed']=False
          (root/'manifest.json').write_text(json.dumps(m,indent=2)+'\n')
          freeze={n:sha(root/n) for n in ['harness.html','reviewer.html','manifest.json','blinding-key.json']};Path('/tmp/mot01-v2-freeze.json').write_text(json.dumps(freeze,indent=2)+'\n')
          Path('/tmp/mot01-v2-environment.json').write_text(json.dumps(env,indent=2)+'\n')
          print('MOT01_V2_ENVIRONMENT_AND_SOURCE_FREEZE=PASS')
          print(json.dumps(freeze,sort_keys=True))
          PY

          URL="file://$PWD/prototypes/mot-01/harness.html?diagnostic=1"
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=3000 --user-data-dir=/tmp/mot01-v2-full --dump-dom "$URL" > /tmp/mot01-v2-full.html 2>/tmp/mot01-v2-full.log
          "$BROWSER" --headless=new --no-sandbox --disable-gpu --allow-file-access-from-files --virtual-time-budget=3000 --force-prefers-reduced-motion --user-data-dir=/tmp/mot01-v2-reduced --dump-dom "$URL" > /tmp/mot01-v2-reduced.html 2>/tmp/mot01-v2-reduced.log

          python - <<'PY'
          import hashlib, html.parser, json, re
          from pathlib import Path
          root=Path('prototypes/mot-01');key=json.loads((root/'blinding-key.json').read_text());manifest=json.loads((root/'manifest.json').read_text());add=json.loads(Path('docs/evidence/MOT_01_EXECUTION_DEFAULTS_ADDENDUM_01.json').read_text());freeze=json.loads(Path('/tmp/mot01-v2-freeze.json').read_text())
          class Grab(html.parser.HTMLParser):
              def __init__(self): super().__init__();self.on=False;self.parts=[]
              def handle_starttag(self,tag,attrs):
                  if tag=='pre' and dict(attrs).get('id')=='diagnostic-report':self.on=True
              def handle_endtag(self,tag):
                  if tag=='pre' and self.on:self.on=False
              def handle_data(self,data):
                  if self.on:self.parts.append(data)
          def load(path):
              g=Grab();g.feed(Path(path).read_text(errors='replace'));raw=''.join(g.parts).strip()
              if not raw:raise RuntimeError('missing diagnostic '+path)
              return json.loads(raw)
          full=load('/tmp/mot01-v2-full.html');red=load('/tmp/mot01-v2-reduced.html');fb={x['id']:x for x in full['specimens']};rb={x['id']:x for x in red['specimens']}
          failures=[];per=[];cubic=re.sub(r'\s+','','cubic-bezier(0.2,0,0,1)');norm=lambda x:re.sub(r'\s+','',str(x));near=lambda a,b,t=1e-6:abs(float(a)-float(b))<=t
          def F(msg):failures.append(msg)
          ids=set(key['mapping']);
          if set(fb)!=ids:F('FULL matrix mismatch')
          if set(rb)!=ids:F('REDUCED matrix mismatch')
          if full['reduced'] is not False:F('FULL reduced-motion state wrong')
          if red['reduced'] is not True:F('REDUCED emulation failed')
          if full['userAgent']!=manifest['environment']['userAgent'] or red['userAgent']!=manifest['environment']['userAgent']:F('userAgent differs from frozen environment')
          if full['devicePixelRatio']!=manifest['environment']['devicePixelRatio'] or red['devicePixelRatio']!=manifest['environment']['devicePixelRatio']:F('devicePixelRatio differs from frozen environment')
          static={}
          expected_count={'CNEG':4,'CPOS':8,'F1':4,'F2':4,'F3':4,'F4':4}
          for anon,sid in sorted(key['mapping'].items()):
              fam,ctx,view=sid.split('-',2);f=fb[anon];r=rb[anon];errs=[]
              def sf(m):errs.append(m);F(f'{anon}: {m}')
              width=640 if view=='WIDE' else 320;dy=56 if ctx=='WEB' else 28;left=add['layout_defaults']['wide_left_positions_px'] if view=='WIDE' else add['layout_defaults']['reflow_320_left_positions_px']
              if (f['context'],f['viewport'],f['width'],f['height'])!=(ctx,view,width,240):sf('context/viewport/frame mismatch')
              if f['initialAnimations'] or r['initialAnimations']:sf('autoplay present')
              if f['scrollWidth']>width or r['scrollWidth']>width or f['chromeScrollWidth']>f['chromeWidth'] or r['chromeScrollWidth']>r['chromeWidth']:sf('horizontal overflow')
              if not all([f['focusBefore'],f['focusAfter'],r['focusBefore'],r['focusAfter']]):sf('focus retention failure')
              if f['animationsAfter']!=expected_count[fam]:sf('FULL animation count mismatch')
              if r['animationsAfter']!=0:sf('REDUCED animation created')
              for i,g in enumerate(f['geometry']):
                  if [g['left'],g['top'],g['width'],g['height']]!=[left[i],72,36,36]:sf('token geometry mismatch')
              for st in f['styles']:
                  if st['fontSize']!='14px' or str(st['fontWeight'])!='600' or st['color']!='rgb(17, 17, 17)' or st['background']!='rgb(230, 230, 230)' or not near(st['opacity'],1):sf('initial token style mismatch')
              static.setdefault((ctx,view),set()).add(json.dumps({'g':f['geometry'],'s':f['styles']},sort_keys=True))
              for i,elist in enumerate(f['effects']):
                  if fam=='CPOS':
                      if len(elist)!=2:sf('CPOS effect count mismatch');continue
                      pos=[e for e in elist if any(k.get('transform') is not None for k in e['keyframes'])];opa=[e for e in elist if any(k.get('opacity') is not None for k in e['keyframes'])]
                      if len(pos)!=1 or len(opa)!=1:sf('CPOS split effects missing');continue
                      if pos[0]['timing']['duration']!=720 or norm(pos[0]['timing']['easing'])!=cubic:sf('CPOS position timing mismatch')
                      if opa[0]['timing']['duration']!=720 or norm(opa[0]['timing']['easing'])!='linear':sf('CPOS opacity timing mismatch')
                      if [k['offset'] for k in opa[0]['keyframes']]!=[0,.5,1]:sf('CPOS opacity offsets mismatch')
                  else:
                      if len(elist)!=1:sf(f'{fam} effect count mismatch');continue
                      e=elist[0];t=e['timing']
                      if t['fill']!='forwards' or t['iterations']!=1:sf(f'{fam} common timing mismatch')
                      if fam=='CNEG' and not(t['duration']==260 and t['delay']==0 and norm(t['easing'])==cubic):sf('CNEG timing mismatch')
                      if fam=='F1' and not(t['duration']==520 and t['delay']==[0,90,180,270][i] and norm(t['easing'])==cubic):sf('F1 timing mismatch')
                      if fam=='F2':
                          if not(t['duration']==680 and t['delay']==0 and norm(t['easing'])=='linear'):sf('F2 timing mismatch')
                          if not all(near(a,b) for a,b in zip([k['offset'] for k in e['keyframes']],[0,220/680,340/680,1])):sf('F2 offsets mismatch')
                          if [norm(k['easing']) for k in e['keyframes'][:3]]!=[cubic,'linear',cubic]:sf('F2 interval easing mismatch')
                      if fam=='F3' and not(t['duration']==[720,440,440,720][i] and t['delay']==0 and norm(t['easing'])==cubic):sf('F3 timing mismatch')
                      if fam=='F4':
                          if not(t['duration']==620 and t['delay']==0 and norm(t['easing'])=='linear'):sf('F4 timing mismatch')
                          if not all(near(a,b) for a,b in zip([k['offset'] for k in e['keyframes']],[0,220/620,430/620,1])):sf('F4 offsets mismatch')
              for z in f['final']:
                  if abs(z['translateY']-dy)>.06 or abs(z['opacity']-1)>.06:sf('FULL deterministic end checkpoint mismatch')
                  if any(p is None or abs(p-1)>1e-6 for p in z['progress']):sf('FULL deterministic progress not 1')
              for z in r['final']:
                  if abs(z['translateY']-dy)>.06 or abs(z['opacity']-1)>.06 or z['animations']!=0:sf('REDUCED final/suppression mismatch')
              per.append({'anonymous_id':anon,'source_specimen_id':sid,'family':fam,'context':ctx,'viewport':view,'pass':not errs,'failures':errs})
          for group,sigs in static.items():
              if len(sigs)!=1:F('static start equivalence mismatch '+str(group))
          harness=(root/'harness.html').read_text();reviewer=(root/'reviewer.html').read_text()
          for sid in key['mapping'].values():
              if sid in harness or sid in reviewer:F('unblinded source ID leaked: '+sid)
          for word in ['Kymaean','Ensemble','Threshold K','O3 wordmark','Character','Performance','Opportunity']:
              if word in harness:F('forbidden carrier in harness: '+word)
          if any(x in reviewer.lower() for x in ['<input','<select','<textarea']):F('reviewer contains scoring input control')
          sha=lambda p:hashlib.sha256(p.read_bytes()).hexdigest();after={n:sha(root/n) for n in ['harness.html','reviewer.html','manifest.json','blinding-key.json']}
          if after!=freeze:F('source changed after pre-execution freeze')
          ev={'schema':'kymaean.mot01.structural-accessibility-preflight.v1','status':'CLEAN_PREFLIGHT_NO_SCORING' if not failures else 'FAILED_PREFLIGHT_NO_SCORING','date':'2026-09-09','program_id':'MOT-01','authority':{'website_main_before_packet':'e3a08c3dc73cd0c5295ed21f9d6b03d921a0c68b','method_main':'38e3ea61d336900fb05a0a6b2e8e5206aa23a5d0','execution_defaults_main':'e3a08c3dc73cd0c5295ed21f9d6b03d921a0c68b'},'attempt_history':[{'attempt':1,'workflow_run_id':34317229528,'disposition':'INVALID_DIAGNOSTIC_ATTEMPT_NO_FAMILY_RESULT','reason':'Attempt 01 treated wall-clock animation completion as conformance evidence even though frozen method L-037 explicitly says wall-clock frame timing is not evidence and permits deterministic animation.currentTime checkpoints. Its only 192 reported failures were four tokens x 24 specimens x final-state/playState wall-clock assertions; the temporary branch currency guard also stopped the invalid report before commit.'},{'attempt':2,'disposition':'CURRENT_VALID_PREFLIGHT'}],'environment':manifest['environment'],'source_freeze_sha256':freeze,'diagnostics':{'full_prefers_reduced_motion':full['reduced'],'reduced_prefers_reduced_motion':red['reduced'],'matrix_count_full':len(full['specimens']),'matrix_count_reduced':len(red['specimens']),'checkpointing':'animation.currentTime set to delay+duration as explicitly permitted by frozen method'},'checks':{'matrix':not any('matrix' in x for x in failures),'no_autoplay':not any('autoplay' in x for x in failures),'geometry_and_reflow':not any(('geometry' in x or 'overflow' in x) for x in failures),'focus':not any('focus' in x for x in failures),'animation_declarations':not any(('timing mismatch' in x or 'offsets mismatch' in x or 'easing mismatch' in x or 'effects missing' in x) for x in failures),'deterministic_full_end':not any('FULL deterministic' in x for x in failures),'reduced_motion':not any('REDUCED' in x for x in failures),'static_equivalence':not any('static start equivalence' in x for x in failures),'blinding_and_exclusions':not any(('leaked' in x or 'forbidden' in x or 'scoring input' in x) for x in failures),'source_immutability':not any('source changed' in x for x in failures)},'specimens':per,'failures':failures,'reviewer_exposure':False,'reviewer_scores_exist':False,'scoring_performed':False,'interpretation':'Preflight only. No motion family is scored, ranked, selected or converged; no production timing token or Stage-motion authority is created.'}
          Path('docs/evidence/MOT_01_STRUCTURAL_ACCESSIBILITY_PREFLIGHT_01.json').write_text(json.dumps(ev,indent=2)+'\n')
          print('MOT01_V2_PREFLIGHT_STATUS='+ev['status']);print('MOT01_V2_FAILURE_COUNT='+str(len(failures)))
          for x in failures:print('MOT01_V2_FAIL='+x)
          PY

          python tools/validate_document_status.py
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-mot01-browser-preflight-v2.yml
          git add prototypes/mot-01/harness.html prototypes/mot-01/manifest.json docs/evidence/MOT_01_STRUCTURAL_ACCESSIBILITY_PREFLIGHT_01.json
          git diff --cached --check
          git commit -m "Record corrected MOT-01 structural and accessibility preflight"
          git push origin HEAD:tmp/mot01-preflight-v2

          python - <<'PY'
          import json
          if json.load(open('docs/evidence/MOT_01_STRUCTURAL_ACCESSIBILITY_PREFLIGHT_01.json'))['status']!='CLEAN_PREFLIGHT_NO_SCORING':raise SystemExit(1)
          PY
