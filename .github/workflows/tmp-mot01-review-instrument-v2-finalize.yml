name: Temporary MOT-01 review-instrument v2 finalize

on:
  push:
    branches:
      - design/mot01-blinded-review-instrument-02

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Supersede v1, append L-041 and validate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p1=Path('docs/evidence/MOT_01_BLINDED_PRIMARY_REVIEW_INSTRUMENT_01.json')
          d1=json.loads(p1.read_text())
          d1['status']='SUPERSEDED_BEFORE_FIRST_PRIMARY_REVIEW'
          d1['superseded_by']='docs/evidence/MOT_01_BLINDED_PRIMARY_REVIEW_INSTRUMENT_02.json'
          d1['supersession_reason']='Pre-use audit found missing explicit product-context blindness attestation required by frozen R6 timing. Zero primary records existed under v1.'
          p1.write_text(json.dumps(d1,indent=2)+'\n')

          d2=json.loads(Path('docs/evidence/MOT_01_BLINDED_PRIMARY_REVIEW_INSTRUMENT_02.json').read_text())
          assert d2['status']=='FROZEN_REVIEW_INSTRUMENT_ZERO_PRIMARY_RECORDS_NO_UNBLINDING'
          assert d2['review_population']['primary_record_count']==3
          assert 'INELIGIBLE' in d2['review_population']['current_design_sol_eligibility']
          assert 'INELIGIBLE' in d2['review_population']['current_director_session_eligibility']
          att=d2['pre_reveal_record_schema']['blindness_attestation']
          assert att['product_context_and_mot01_purpose_not_seen'] is True
          assert att['specific_r6_product_semantics_not_seen'] is True
          assert d2['claim_boundary']['unblinding_allowed_by_this_instrument'] is False
          PY

          if ! grep -q '^## L-041 — MOT-01 review instrument v2 corrects pre-reveal product-context blindness$' docs/evidence/DESIGN_LEDGER.md; then
            cat >> docs/evidence/DESIGN_LEDGER.md <<'EOF'

          ## L-041 — MOT-01 review instrument v2 corrects pre-reveal product-context blindness

          **State:** Q-DESIGN-10 ACTIVE / INSTRUMENT 01 SUPERSEDED BEFORE USE / INSTRUMENT 02 FROZEN / 0 OF 3 PRIMARY RECORDS

          A recursive audit immediately after L-040 found one review-integrity omission before any primary record or reviewer exposure: Instrument 01 attested mapping/source blindness but did not explicitly attest **product-context blindness**, even though frozen L-037 makes R1-R5 blind and reveals Kymaean/MOT-01 product context only at R6 after R1-R5 are locked.

          Instrument 01 is therefore `SUPERSEDED_BEFORE_FIRST_PRIMARY_REVIEW`. Current authority is `docs/evidence/MOT_01_BLINDED_PRIMARY_REVIEW_INSTRUMENT_02.json`. Instrument 02 adds explicit attestations that MOT-01/Kymaean product purpose and the R6 semantics list were not seen before pre-reveal lock; all three pre-reveal records must still freeze before any R6 reveal.

          This correction changes current-run reviewer eligibility, not the frozen population law. Design Sol is ineligible because construction exposed anonymous-to-mechanism mapping. The current Director session is also ineligible because this conversation already exposed the MOT-01 product/shared-brand context. The original method still requires at least one Director **or another independent human** reviewer, so the present run must use three genuinely blind reviewers outside these exposed sessions, with at least one independent human visual reviewer; the other two may be independent humans or genuinely blind independent evaluators.

          No scores, pairings, primary records, reviewer exposure, unblinding, family result or convergence existed before this correction. The exact c399 visual packet remains byte-for-byte unchanged.

          **Next gate:** distribute only a sanitized pre-reveal kit containing the exact frozen reviewer/harness bytes plus neutral instructions/blank v2 record form to three eligible blind reviewers. Do not include repository access, the blinding key, MOT-01 purpose, Kymaean context, R6 semantics or another reviewer's judgments.

          **Guardrail:** no R6 context reveal until all three R1-R5 records are frozen; no family/source mapping until a later successor gate; no aggregation, candidate pass/fail, retuning/F5, production motion tokens, Stage motion, app implementation, website deployment or Phase-C convergence.

          **APPROVED BY STANDING DIRECTOR DELEGATION — CLEAN PRE-USE CORRECTION AUDIT.**
          EOF
          fi

          cat > CURRENT_STATE.md <<'EOF'
          <!-- D-R1-STATUS: ACTIVE LAW -->

          # Ensemble Website — Current State

          Updated: 2026-09-09

          ## Authority
          Design/brand: `Rylascoo/Ensemble-Website`. Product/engineering truth: `Rylascoo/Ensemble-Project/CURRENT_STATE.md`. Workflow: `AGENTS.md`. Durable closure: `docs/evidence/DESIGN_LEDGER.md`. This file alone owns volatile design phase/current-boundary state.

          ## Repository / cross-project
          `main` is authoritative. `site/` is the only deployable/public website root; product/backend remains in `Rylascoo/Ensemble-Project`. Central sequencing: `Rylascoo/Ensemble-Project/docs/PROJECT_EXECUTION_QUEUE.md`.

          ## Hero — STATIC RESEARCH PAUSED
          Frozen Hero Brief 02 + Falsification Criteria 01 + Surface Escape + corrected/re-frozen Harness 01 + ODR-33 remain unchanged. No final hero. Reopening law: `docs/evidence/HERO_POST_PROGRAM_RECONCILIATION_01.txt`.

          ## Shared brand — TYP-01 CLOSED / MOT-01 BLIND REVIEW ACTIVE
          TYP-01 remains closed. MOT-01 selection/method/defaults: L-036/L-037/L-038. Q-DESIGN-09 preflight is clean: `docs/evidence/MOT_01_STRUCTURAL_ACCESSIBILITY_PREFLIGHT_01.json` / L-039. Exact visual packet remains c399.

          Q-DESIGN-10 is active. Instrument 01 is superseded before use; current collection law is `docs/evidence/MOT_01_BLINDED_PRIMARY_REVIEW_INSTRUMENT_02.json` / L-041. **0 of 3** primary records exist. Design Sol is ineligible because mapping was exposed during construction; this Director session is ineligible because MOT-01 product context was already exposed here. Present run therefore needs three genuinely blind outside reviewers, including at least one independent human visual reviewer.

          MOT-01 has **no Q-DESIGN-02 Stage-motion authority** and selects no final motion/timing tokens, identity, website surface or app visual system.

          ## Exact next action / hard boundary
          Distribute a sanitized pre-reveal kit containing only exact c399 `reviewer.html` + `harness.html`, neutral pre-reveal instructions and blank v2 record form. Collect three R1-R5 records from eligible blind reviewers; freeze all three before revealing R6 product context. Then collect three R6 addenda referencing immutable pre-reveal hashes.

          No repository/blinding-key access for reviewers; no pre-R6 Kymaean/MOT-01 purpose or product-semantics disclosure. No unblinding, control calibration, aggregation, candidate pass/fail, family selection, retuning/F5, final motion tokens, Stage motion, app implementation or website deployment under Q-DESIGN-10.

          Transcript-dependent Stage motion still waits on real blinded E0-A vs E0-E evidence.
          EOF

          python tools/validate_document_status.py
          python tools/validate_repository_boundaries.py
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-mot01-review-instrument-v2-finalize.yml
          git add CURRENT_STATE.md docs/evidence/DESIGN_LEDGER.md docs/evidence/MOT_01_BLINDED_PRIMARY_REVIEW_INSTRUMENT_01.json
          git diff --cached --check
          git commit -m "Correct MOT-01 pre-reveal context blindness"
          git push origin HEAD:design/mot01-blinded-review-instrument-02
