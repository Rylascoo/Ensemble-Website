name: Temporary regenerate document index

on:
  push:
    branches:
      - design/q-design-16-closeout-color-reentry

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/q-design-16-closeout-color-reentry
      - name: Regenerate deterministic document index and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_docs_index.py
          git rm .github/workflows/tmp-regenerate-doc-index.yml
          git add docs/INDEX.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Regenerate document index for MOT-01 closeout'
          git push origin HEAD:design/q-design-16-closeout-color-reentry
