          # Ensemble Website — Current State

          Updated: 2026-09-08

          ## Authority
          Design/brand: `Rylascoo/Ensemble-Website`. Product/engineering truth: `Rylascoo/Ensemble-Project/CURRENT_STATE.md`. Workflow: `AGENTS.md`. Durable closure: `docs/evidence/DESIGN_LEDGER.md`. This file alone owns volatile design phase/current-boundary state.

          ## Repository / cross-project
          `main` is authoritative. `site/` is the only deployable/public website root; product/backend remains in `Rylascoo/Ensemble-Project`. Central sequencing: `Rylascoo/Ensemble-Project/docs/PROJECT_EXECUTION_QUEUE.md`.

          ## Hero — STATIC RESEARCH PAUSED
          Hero Brief 02 + Falsification Criteria 01 + Surface Escape + corrected/re-frozen Harness 01 + ODR-33 remain unchanged. No final hero is selected. Post-program diagnosis/reopening law: `docs/evidence/HERO_POST_PROGRAM_RECONCILIATION_01.txt`.

          ## Shared brand — TYP-01 CLOSED AT ACCESSIBILITY PREFLIGHT / ZERO SURVIVORS
          The Phase-B re-entry audit selected **TYP-01 — Typographic / Editorial Identity Independence**. Frozen method: `docs/evidence/TYP_01_TYPOGRAPHIC_EDITORIAL_IDENTITY_INDEPENDENCE_METHOD_AND_MATRIX_01.json`. Pre-execution deterministic defaults: `docs/evidence/TYP_01_EXECUTION_DEFAULTS_ADDENDUM_01.json`. A second pre-render residual-default audit, frozen before any specimen existed, is preserved at `docs/evidence/TYP_01_EXECUTION_DEFAULTS_ADDENDUM_02.json`. Durable closures: Design Ledger L-033/L-034/L-035. Result evidence: `docs/evidence/TYP_01_PREFLIGHT_FAILURE_AND_TERMINATION_01.json`.

          The exact 24-specimen text-only packet passed matrix cardinality, CP-01 exact-content isolation, neutral reference-face, contrast, structural APP scannability and cross-context invariant checks, but **failed the frozen accessibility preflight**. Eight specimens overflowed horizontally at 320px under stress; every scored family F1-F4 failed at least one REFLOW_320 200%-resize check. A hosted 24-specimen source-conformance audit found no overflow-relevant mechanical deviation from the frozen frame, padding, measure, context-multiplier, font-size or natural-wrapping rules.

