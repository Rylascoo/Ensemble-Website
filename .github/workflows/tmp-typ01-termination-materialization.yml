    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Materialize TYP-01 closure tree
        shell: bash
        run: |
          set -euo pipefail

          git show 3051ba25fa5d39bbecef6d6d28754c1cf2c02243:docs/evidence/TYP_01_EXECUTION_DEFAULTS_ADDENDUM_02.json > docs/evidence/TYP_01_EXECUTION_DEFAULTS_ADDENDUM_02.json

