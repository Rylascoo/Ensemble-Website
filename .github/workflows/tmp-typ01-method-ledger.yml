name: Temporary TYP-01 method ledger materialization

on:
  push:
    branches:
      - tmp/typ01-method-ledger-materialization

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate frozen JSON contract
        run: python3 -m json.tool docs/evidence/TYP_01_TYPOGRAPHIC_EDITORIAL_IDENTITY_INDEPENDENCE_METHOD_AND_MATRIX_01.json > /dev/null
      - name: Append durable L-033 closure
        run: |
          python3 - <<'PY'
          from pathlib import Path
          ledger = Path('docs/evidence/DESIGN_LEDGER.md')
          helper = Path('.tmp/L033_TYP01_METHOD.frag')
          marker = '## L-033 — TYP-01 method contract and dual-context specimen matrix are frozen'
          data = ledger.read_text(encoding='utf-8')
          if marker not in data:
              block = helper.read_text(encoding='utf-8').rstrip()
              ledger.write_text(data.rstrip() + '\n\n' + block + '\n', encoding='utf-8')
          PY
      - name: Validate document-status/index structure
        run: python3 tools/validate_document_status.py
      - name: Commit ledger closure when changed
        run: |
          if git diff --quiet -- docs/evidence/DESIGN_LEDGER.md; then
            echo "Ledger closure already materialized"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/evidence/DESIGN_LEDGER.md
          git commit -m "tmp: materialize TYP-01 method closure"
          git push origin HEAD:tmp/typ01-method-ledger-materialization
