name: Temporary CS2 exemplar syntax correction

on:
  push:
    branches:
      - design/mot01-cs2-envelope-exemplars

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/mot01-cs2-envelope-exemplars
      - name: Correct exact missing brace and remove helper
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('prototypes/mot-01/cs2-envelope/exemplars.html')
          s=p.read_text()
          old="else{f.classList.add('loading');f.append(el('h3','','Preparing new context…'),el('p','','This is not an already-ready context. The crossfade is intentionally wrong.'));for(let i=0;i<5;i++)f.append(el('div','skeleton'));\n }else if(caseId==='N2_DENSE_TEXT_GHOSTING'){"
          new="else{f.classList.add('loading');f.append(el('h3','','Preparing new context…'),el('p','','This is not an already-ready context. The crossfade is intentionally wrong.'));for(let i=0;i<5;i++)f.append(el('div','skeleton'));}\n }else if(caseId==='N2_DENSE_TEXT_GHOSTING'){"
          if s.count(old)!=1:
              raise SystemExit(f'expected exact source target once, found {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          python3 - <<'PY'
          from pathlib import Path
          s=Path('prototypes/mot-01/cs2-envelope/exemplars.html').read_text()
          js=s.split('<script>',1)[1].split('</script>',1)[0]
          Path('/tmp/exemplar.js').write_text(js)
          PY
          node --check /tmp/exemplar.js
          git rm .github/workflows/tmp-cs2-exemplar-syntax-fix.yml
          git add prototypes/mot-01/cs2-envelope/exemplars.html
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Correct CS2 exemplar syntax before execution'
          git push origin HEAD:design/mot01-cs2-envelope-exemplars
