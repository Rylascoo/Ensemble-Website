    branches:
      - design/clr01-q19-diagnostic-repair-2026-09-10

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 20
      - name: Complete Q-DESIGN-19 continuity closeout
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_PARENT=b97baedfd00130568d49c545c6f8b6c536a327ad
          test "$(git rev-parse HEAD^)" = "$EXPECTED_PARENT"
          python3 - <<'PY'
          from pathlib import Path
          ledger = Path('docs/evidence/DESIGN_LEDGER.md')
          s = ledger.read_text()
          marker = '## L-056 — CLR-01 Q-DESIGN-19 corrected preflight is clean; Design Sol view v2 frozen'
          assert marker not in s
          s = s.replace('Updated: 2026-09-09', 'Updated: 2026-09-10', 1)
          entry = [
              '',
              marker,
              '',
              '**State:** Q-DESIGN-19 ACTIVE / CORRECTED 24+24 PREFLIGHT CLEAN / DESIGN SOL VIEW 02 FROZEN / DIRECTOR ADJUDICATION PENDING / NO PRODUCTION COLOR AUTHORITY',
