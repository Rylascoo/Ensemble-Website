name: Temporary Website Mascot Closeout Generator

on:
  push:
    branches:
      - site/v2-2-mascot-placement-study-closeout-2026-09-16

permissions:
  contents: write

jobs:
  generate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: site/v2-2-mascot-placement-study-closeout-2026-09-16
          fetch-depth: 0
      - name: Append L-190 exactly once
        shell: bash
        run: |
          set -euo pipefail
          if ! grep -q '^## L-190 ' docs/evidence/DESIGN_LEDGER.md; then
            printf '%s' '' | base64 -d >> docs/evidence/DESIGN_LEDGER.md
          fi
      - name: Regenerate canonical document index
        run: python3 tools/generate_docs_index.py
      - name: Validate generated closeout
        run: |
          python3 tools/validate_document_status.py
          python3 tools/validate_repository_boundaries.py
          python3 tools/generate_docs_index.py --check
          git diff --check
      - name: Commit generated continuity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/INDEX.md docs/evidence/DESIGN_LEDGER.md
          if ! git diff --cached --quiet; then
            git commit -m 'website: close Bellweather placement study continuity'
            git push origin HEAD:refs/heads/site/v2-2-mascot-placement-study-closeout-2026-09-16
          fi
