name: Temporary fresh-chat handoff index closeout

on:
  push:
    branches:
      - design/fresh-chat-handoff-phase-b-packets-2026-09-10

permissions:
  contents: write

jobs:
  closeout:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 20
      - name: Regenerate corpus index and close handoff
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/generate_docs_index.py
          python3 tools/generate_docs_index.py --check
          python3 tools/validate_document_status.py
          test "$(wc -c < CURRENT_STATE.md)" -le 3072
          rm -f .github/workflows/tmp-fresh-chat-handoff-index-closeout.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/INDEX.md .github/workflows/tmp-fresh-chat-handoff-index-closeout.yml
          git diff --cached --check
          git commit -m "Regenerate corpus index for Design handoff"
          python3 tools/validate_repository_boundaries.py
          git push origin HEAD:refs/heads/design/fresh-chat-handoff-phase-b-packets-2026-09-10
