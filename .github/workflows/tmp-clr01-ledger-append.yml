name: Temporary CLR-01 ledger append

on:
  push:
    branches:
      - design/clr01-method

permissions:
  contents: write

jobs:
  append:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: design/clr01-method
      - name: Append L-054 and remove helper
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d >> docs/evidence/DESIGN_LEDGER.md
          git rm .github/workflows/tmp-clr01-ledger-append.yml
          git add docs/evidence/DESIGN_LEDGER.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Record CLR-01 method freeze'
          git push origin HEAD:design/clr01-method
