name: Temporary SYM-01 browser preflight

on:
  push:
    branches:
      - design/sym01-primary-symbol-successor-2026-09-10

permissions:
  contents: read

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Static frozen-contract checks
        run: python tools/verify_sym01.py
      - name: Hosted Chrome matrix checks
        shell: bash
        run: |
          set -euo pipefail
          BROWSER="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$BROWSER"
          export BROWSER          BROWSER_VERSION="$($BROWSER --version)"
          OS_PRETTY="$(. /etc/os-release; printf '%s' "$PRETTY_NAME")"
          mkdir -p /tmp/sym01-artifact/diagnostics
          python -m http.server 8765 --bind 127.0.0.1 >/tmp/sym01-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          for _ in $(seq 1 50); do
            if curl -fsS http://127.0.0.1:8765/prototypes/sym-01/harness.html >/dev/null; then break; fi
            sleep 0.1
          done
          curl -fsS http://127.0.0.1:8765/prototypes/sym-01/harness.html >/dev/null
          cat > /tmp/sym01-cdp.mjs <<'NODE'
          import { spawn } from 'node:child_process';
          import fs from 'node:fs';
          const [mode,widthArg,diagPath,profile] = process.argv.slice(2);
          const width=Number(widthArg), height=3000, browser=process.env.BROWSER;
          fs.rmSync(profile,{recursive:true,force:true}); fs.mkdirSync(profile,{recursive:true});
          const args=['--headless=new','--no-sandbox','--disable-gpu','--disable-dev-shm-usage','--remote-debugging-port=0',`--user-data-dir=${profile}`,'about:blank'];
          if(mode==='forced') args.splice(args.length-1,0,'--force-high-contrast');
          const cp=spawn(browser,args,{stdio:['ignore','ignore','inherit']});
          const sleep=ms=>new Promise(r=>setTimeout(r,ms));
          async function port(){
            const active=profile+'/DevToolsActivePort';
            for(let i=0;i<400;i++){
              if(fs.existsSync(active)){const [p]=fs.readFileSync(active,'utf8').trim().split(/\r?\n/); if(p) return p;}
              if(cp.exitCode!==null) throw new Error('Chrome exited before DevTools endpoint: '+cp.exitCode);
              await sleep(100);
            }
            throw new Error('DevToolsActivePort unavailable');
          }          try {
            const p=await port(); let target=null;
            for(let i=0;i<100;i++){
              try{const r=await fetch(`http://127.0.0.1:${p}/json/new?about%3Ablank`,{method:'PUT'}); if(r.ok){target=await r.json();break;}}catch{}
              await sleep(100);
            }
            if(!target?.webSocketDebuggerUrl) throw new Error('page target unavailable');
            const ws=new WebSocket(target.webSocketDebuggerUrl);
            await new Promise((res,rej)=>{ws.onopen=res;ws.onerror=rej});
            let id=0; const pending=new Map();
            ws.onmessage=e=>{const m=JSON.parse(e.data);if(m.id&&pending.has(m.id)){const q=pending.get(m.id);pending.delete(m.id);m.error?q.rej(new Error(JSON.stringify(m.error))):q.res(m.result)}};
            const send=(method,params={})=>new Promise((res,rej)=>{const n=++id;pending.set(n,{res,rej});ws.send(JSON.stringify({id:n,method,params}))});
            await send('Page.enable'); await send('Runtime.enable');
            await send('Emulation.setDeviceMetricsOverride',{width,height,deviceScaleFactor:1,mobile:false,screenWidth:width,screenHeight:height});
            const nav=await send('Page.navigate',{url:'http://127.0.0.1:8765/prototypes/sym-01/harness.html'});
            if(nav?.errorText) throw new Error('navigate: '+nav.errorText);
            let diag=null,last=null;
            for(let i=0;i<150;i++){
              const ev=await send('Runtime.evaluate',{expression:'window.__SYM_DIAGNOSTIC__||null',returnByValue:true});
              last=ev?.result?.value||null; if(last){diag=last;break;} await sleep(100);
            }
            if(!diag) throw new Error('SYM diagnostic missing: '+JSON.stringify(last));
            fs.writeFileSync(diagPath,JSON.stringify(diag)+'\n'); ws.close();
          } finally {
            cp.kill('SIGTERM'); await Promise.race([new Promise(r=>cp.once('exit',r)),sleep(1500)]);
          }
          NODE          run_cdp() {
            local mode="$1" width="$2" stem="$3"
            node --experimental-websocket /tmp/sym01-cdp.mjs "$mode" "$width" "/tmp/sym01-artifact/diagnostics/$stem.json" "/tmp/sym01-$stem"
          }
          run_cdp normal 1200 normal-wide
          run_cdp forced 1200 forced-wide
          run_cdp normal 320 normal-320
          run_cdp forced 320 forced-320
          python tools/verify_sym01.py \
            --normal-wide /tmp/sym01-artifact/diagnostics/normal-wide.json \
            --forced-wide /tmp/sym01-artifact/diagnostics/forced-wide.json \
            --normal-320 /tmp/sym01-artifact/diagnostics/normal-320.json \
            --forced-320 /tmp/sym01-artifact/diagnostics/forced-320.json \
            --browser-version "$BROWSER_VERSION" --os-pretty "$OS_PRETTY" \
            --output /tmp/sym01-artifact/SYM_01_BROWSER_PREFLIGHT_01.json
          cp prototypes/sym-01/harness.html /tmp/sym01-artifact/harness.html
          cp docs/evidence/SYM_01_FROZEN_CANDIDATE_MANIFEST_01.json /tmp/sym01-artifact/manifest.json
          cp docs/evidence/SYM_01_PRIMARY_SYMBOL_APP_ICON_SUCCESSOR_METHOD_AND_MATRIX_01.json /tmp/sym01-artifact/method.json
          cp -R prototypes/sym-01/assets /tmp/sym01-artifact/assets
          printf '%s\n' "$BROWSER_VERSION" > /tmp/sym01-artifact/browser-version.txt
          printf '%s\n' "$OS_PRETTY" > /tmp/sym01-artifact/os-pretty.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sym01-preflight
          path: /tmp/sym01-artifact
          if-no-files-found: error
          retention-days: 7